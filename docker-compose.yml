# musloop with Docker Compose:
#   docker compose up -d        -> http://localhost:8801
#   docker compose logs -f      (server log)
#   docker compose down         (stop; your tracks stay in the "musloop-data" volume)
services:
  musloop:
    build: .
    image: musloop
    container_name: musloop
    ports:
      # the app: this computer only (keep it on 127.0.0.1)
      - "127.0.0.1:8801:8801"
      # phone remote (Live mode → 📱 Phone): open to your Wi-Fi. Only the remote
      # page is reachable on this port, and only with the key from the QR code.
      - "8802:8802"
    volumes:
      - musloop-data:/data
      # Optional: make a music folder on your disk visible to ☰ → Folders.
      # Inside musloop add the folder as /music.
      # - /path/to/your/music:/music:ro
    restart: unless-stopped

volumes:
  musloop-data:

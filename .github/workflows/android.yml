name: Android app
on:
  push:
    branches: [main, dev]
    tags: ["app-v*"]
    paths: [mobile/**, frontend/remote.src.js, frontend/remote.html, frontend/vendor/**, backend/remote.py, tools/build.py, .github/workflows/android.yml]
  pull_request:
    paths: [mobile/**, frontend/remote.src.js, backend/remote.py]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Android SDK 36 (the runner ships the SDK; add platform 36 if missing)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: musloop server (for the tests)
        run: |
          pip install --quiet -r requirements.txt quickjs playwright websockets
          python -m playwright install --with-deps chromium
          python tools/build.py
          # a short test track + one with scenes for the remote to show
          python - <<'EOF'
          import numpy as np, soundfile as sf
          sr = 44100; t = np.arange(int(sr * 64)) / sr
          y = 0.3 * np.sin(2 * np.pi * 110 * t) * (1 + (t > 32)) + 0.2 * ((t % 0.5) < 0.05) * np.sin(2 * np.pi * 880 * t)
          sf.write("Village Consort.wav", np.c_[y, y], sr)
          EOF
          mkdir -p /tmp/musloop-data
          PORT=8801 MUSLOOP_DATA=/tmp/musloop-data nohup python -m uvicorn backend.main:app --host 0.0.0.0 --port 8801 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fs localhost:8801/api/health && break; sleep 1; done
          curl -fs -F "file=@Village Consort.wav" localhost:8801/api/upload
          TID=$(curl -fs localhost:8801/api/tracks | python -c "import sys,json;print(json.load(sys.stdin)['tracks'][0]['track_id'])")
          # analyze + save the markup with two scenes (what the GM would do in the UI)
          curl -fs "localhost:8801/api/analyze/$TID" | python -c "
          import sys, json, urllib.request
          a = json.load(sys.stdin)
          mk = {k: a[k] for k in ('duration', 'tempo', 'beats', 'downbeats', 'beats_per_bar', 'meter', 'segments')}
          mk['scenes'] = [{'id': 's1', 'name': 'Exploration', 'segIndex': 0, 'cueMode': 'natural', 'hotkey': '1'},
                          {'id': 's2', 'name': 'Ambush', 'segIndex': min(1, len(a['segments']) - 1), 'cueMode': 'now', 'hotkey': '2'}]
          urllib.request.urlopen(urllib.request.Request('http://localhost:8801/api/markup/$TID', data=json.dumps(mk).encode(),
                                                        headers={'Content-Type': 'application/json'}))
          print('track ready:', len(a['segments']), 'parts')"

      - name: Build APK
        working-directory: mobile
        run: |
          VERSION=0.0.1
          case "$GITHUB_REF" in refs/tags/app-v*) VERSION="${GITHUB_REF_NAME#app-v}";; esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          npm ci 2>&1 | tail -5
          if ! npm run sync > sync.log 2>&1; then echo "::error title=npm run sync::$(tail -15 sync.log | tr '\n' '|')"; exit 1; fi
          cd android
          if ! ./gradlew --no-daemon assembleDebug -PappVersion=$VERSION > ../gradle.log 2>&1; then
            echo "::error title=gradle::$(grep -E 'What went wrong|error:|FAILURE|> ' ../gradle.log | head -20 | tr '\n' '|')"; exit 1
          fi
          ls -la app/build/outputs/apk/debug/

      - name: App web part (connect screen + remote, Pixel 7 emulation)
        run: |
          LAN=$(hostname -I | awk '{print $1}')
          python mobile/tests/app_web_test.py "$LAN" 8801

      - name: Enable KVM (emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Real Android emulator (API 35) — install, connect, control the PC
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          # the action runs every line of `script` as a separate shell command,
          # so the multi-step test lives in one script file
          script: bash mobile/tests/emulator_ci.sh

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musloop-remote-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Logs
        if: always()
        run: tail -60 server.log || true

  release:
    # tag app-v1.2.3 -> signed APK attached to a GitHub release
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Signed release APK
        env:
          KEYSTORE_B64: ${{ secrets.MUSLOOP_KEYSTORE_B64 }}
          MUSLOOP_KEYSTORE_PASSWORD: ${{ secrets.MUSLOOP_KEYSTORE_PASSWORD }}
          MUSLOOP_KEY_ALIAS: ${{ secrets.MUSLOOP_KEY_ALIAS }}
          MUSLOOP_KEY_PASSWORD: ${{ secrets.MUSLOOP_KEY_PASSWORD }}
        run: |
          fail() { echo "::error title=$1::$2"; exit 1; }
          # which secrets arrived (lengths only, never the values)
          echo "::notice title=secrets::KEYSTORE_B64=${#KEYSTORE_B64} chars, STORE_PASSWORD=${#MUSLOOP_KEYSTORE_PASSWORD}, ALIAS='${MUSLOOP_KEY_ALIAS}', KEY_PASSWORD=${#MUSLOOP_KEY_PASSWORD}"
          [ -n "$KEYSTORE_B64" ] || fail "secrets" "MUSLOOP_KEYSTORE_B64 is empty (see mobile/README.md)"
          [ -n "$MUSLOOP_KEYSTORE_PASSWORD" ] || fail "secrets" "MUSLOOP_KEYSTORE_PASSWORD is empty"
          [ -n "$MUSLOOP_KEY_ALIAS" ] || fail "secrets" "MUSLOOP_KEY_ALIAS is empty"
          # spaces / line breaks pasted into the secret are harmless: strip them
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/musloop.jks" 2> b64.err \
            || fail "keystore" "MUSLOOP_KEYSTORE_B64 is not valid base64: $(cat b64.err)"
          export MUSLOOP_KEYSTORE="$RUNNER_TEMP/musloop.jks"
          # empty key password = same as the store password (keytool's default when you press Enter)
          export MUSLOOP_KEY_PASSWORD="${MUSLOOP_KEY_PASSWORD:-$MUSLOOP_KEYSTORE_PASSWORD}"
          keytool -list -keystore "$MUSLOOP_KEYSTORE" -storepass "$MUSLOOP_KEYSTORE_PASSWORD" > ks.txt 2>&1 \
            || fail "keystore" "can't open the keystore with MUSLOOP_KEYSTORE_PASSWORD: $(tail -3 ks.txt | tr '\n' ' ')"
          ALIASES=$(grep -E ', (PrivateKeyEntry|privatekeyentry),' ks.txt | cut -d, -f1 | tr '\n' ' ')
          echo "::notice title=keystore::aliases in the keystore: $ALIASES"
          keytool -list -keystore "$MUSLOOP_KEYSTORE" -storepass "$MUSLOOP_KEYSTORE_PASSWORD" -alias "$MUSLOOP_KEY_ALIAS" > /dev/null 2>&1 \
            || fail "keystore" "alias '$MUSLOOP_KEY_ALIAS' not in the keystore (it has: $ALIASES) — fix MUSLOOP_KEY_ALIAS"
          pip install --quiet quickjs
          python tools/build.py
          VERSION="${GITHUB_REF_NAME#app-v}"
          cd mobile && npm ci > /dev/null && npm run sync > sync.log 2>&1 || fail "npm run sync" "$(tail -10 sync.log | tr '\n' '|')"
          cd android
          ./gradlew --no-daemon assembleRelease -PappVersion=$VERSION > ../gradle.log 2>&1 \
            || fail "gradle" "$(grep -E 'What went wrong|error:|Keystore|password|> ' ../gradle.log | head -15 | tr '\n' '|')"
          APK=app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || fail "gradle" "no signed APK produced: $(ls app/build/outputs/apk/release/ | tr '\n' ' ')"
          cp "$APK" "$GITHUB_WORKSPACE/musloop-remote-$VERSION.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$GITHUB_WORKSPACE/musloop-remote-$VERSION.apk" > sig.txt 2>&1 \
            || fail "apksigner" "$(tail -5 sig.txt | tr '\n' '|')"
          echo "::notice title=signed::$(grep -m1 'certificate DN' sig.txt) $(grep -m1 'SHA-256' sig.txt)"
      - uses: softprops/action-gh-release@v2
        with:
          name: musloop remote ${{ github.ref_name }}
          body: |
            Android app for controlling musloop's Live mode from your phone.
            Install: download the APK on the phone, open it, allow "Install unknown apps" for your browser / file manager.
            Needs musloop on a computer in the same Wi-Fi (Live mode → 📱 Phone shows the QR code).
          files: musloop-remote-*.apk

name: Docker
on:
  push:
    branches: [main, dev]
    paths: [Dockerfile, Dockerfile.ai, .dockerignore, 'docker-compose*.yml', requirements.txt, backend/**, frontend/**, tools/songformer_analyze.py, tools/demix.py, tests/**, .github/workflows/docker.yml]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t musloop:ci .
      - name: Image size
        run: |
          docker image ls musloop:ci --format '{{.Repository}}:{{.Tag}}  {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice title=layers::$(docker history musloop:ci --format '{{.Size}} {{.CreatedBy}}' --no-trunc | cut -c1-110 | tr '\n' '|')"
          echo "::notice title=apt ffmpeg deps::$(docker run --rm --entrypoint sh musloop:ci -c 'du -sh /usr/lib/x86_64-linux-gnu 2>/dev/null; du -sh /venv; du -sh /usr/local/lib/python3*; du -sh /usr/share 2>/dev/null' | tr '\n' ' ')"
      - name: Start container
        run: |
          echo "::notice title=images::$(docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | tr '\n' ' ')"
          if ! out=$(docker run -d --name musloop-ci -p 8801:8801 -p 8802:8802 -v musloop-ci:/data musloop:ci 2>&1); then
            echo "::error title=docker run::$(echo "$out" | tr '\n' ' ')"; exit 1
          fi
          for i in $(seq 1 60); do curl -fs localhost:8801/api/health && break; sleep 1; done
          if ! curl -fs localhost:8801/api/health; then
            echo "::error title=container log::$(docker logs musloop-ci 2>&1 | tail -25 | tr '\n' '|')"; exit 1
          fi
      - name: Test track (two 32 s sections at 120 BPM, generated with the image's ffmpeg)
        run: |
          docker exec musloop-ci ffmpeg -loglevel error \
            -f lavfi -i "sine=frequency=110:duration=32" \
            -f lavfi -i "sine=frequency=880:duration=32,volume='if(lt(mod(t,0.5),0.05),1,0.05)':eval=frame" \
            -f lavfi -i "sine=frequency=165:duration=32" \
            -f lavfi -i "anoisesrc=d=32:c=pink:a=0.3,volume='if(lt(mod(t,0.5),0.06),1,0.1)':eval=frame" \
            -filter_complex "[0][1]amix=inputs=2[a];[2][3]amix=inputs=2[b];[a][b]concat=n=2:v=0:a=1,volume=2" \
            -ac 2 -ar 44100 /tmp/test.mp3
          docker cp musloop-ci:/tmp/test.mp3 "./Тестовый трек.mp3"
      - name: API smoke test (upload, analyze + meter, markup, export, Foundry export)
        run: python3 tests/smoke_api.py 8801 "./Тестовый трек.mp3"
      - name: Phone remote security (app port 8801, remote-only port 8802)
        run: |
          pip install --quiet websockets
          # the runner's own LAN address = a "phone" on the network
          LAN=$(hostname -I | awk '{print $1}')
          python3 tests/remote_security.py "$LAN" 8801 8802
      - name: Data survives a restart (volume)
        run: |
          docker rm -f musloop-ci
          docker run -d --name musloop-ci2 -p 8801:8801 -v musloop-ci:/data musloop:ci
          for i in $(seq 1 60); do curl -fs localhost:8801/api/health && break; sleep 1; done
          curl -fs localhost:8801/api/tracks | python3 -c "import sys,json; t=json.load(sys.stdin)['tracks']; print(len(t),'track(s)'); assert t"
      - name: Logs
        if: always()
        run: docker logs musloop-ci 2>/dev/null || docker logs musloop-ci2

  arm64:
    # Apple M-series Macs (arm64): build under QEMU and check the app imports and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/arm64
        run: docker buildx build --platform linux/arm64 -t musloop:arm64 --load .
      - name: Run on arm64
        run: |
          docker run -d --platform linux/arm64 --name musloop-arm -p 8802:8801 musloop:arm64
          for i in $(seq 1 120); do curl -fs localhost:8802/api/health && break; sleep 2; done
          curl -fs localhost:8802/api/health
          docker exec musloop-arm python -c "import librosa, sklearn, numba; print('arm64 imports ok')"
          docker exec musloop-arm ffmpeg -hide_banner -version | head -1
          echo "::notice title=arm64 image::$(docker image ls musloop:arm64 --format '{{.Size}}')"

  ai-cpu:
    # the full image: SongFormer + Demucs on CPU, weights baked in, no network at runtime
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space (runner has ~14 GB; the AI image needs ~10 GB to build)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
      - name: Build musloop:ai (CPU)
        run: DOCKER_BUILDKIT=1 docker build -f Dockerfile.ai -t musloop:ai .
      - name: Image size
        run: |
          docker image ls musloop:ai --format '{{.Repository}}:{{.Tag}}  {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice title=ai image::$(docker image ls musloop:ai --format '{{.Size}}')"
      - name: Start (no network inside the container -> proves the weights are baked in)
        run: |
          docker network create --internal nonet
          docker run -d --name musloop-ai --network nonet -v musloop-ai-ci:/data musloop:ai
          # reach it through a socat sidecar on the default bridge (the app container itself stays offline)
          docker run -d --name proxy --network nonet -p 8801:8801 alpine/socat tcp-listen:8801,fork,reuseaddr tcp-connect:musloop-ai:8801 || true
          docker network connect bridge proxy
          for i in $(seq 1 90); do curl -fs localhost:8801/api/health && break; sleep 2; done
          curl -fs localhost:8801/api/health | tee /tmp/health.json
          python3 -c "import json; h=json.load(open('/tmp/health.json')); assert h['songformer_available'], h"
      - name: Test track
        run: |
          docker exec musloop-ai ffmpeg -loglevel error \
            -f lavfi -i "sine=frequency=110:duration=32" \
            -f lavfi -i "sine=frequency=880:duration=32,volume='if(lt(mod(t,0.5),0.05),1,0.05)':eval=frame" \
            -f lavfi -i "sine=frequency=165:duration=32" \
            -f lavfi -i "anoisesrc=d=32:c=pink:a=0.3,volume='if(lt(mod(t,0.5),0.06),1,0.1)':eval=frame" \
            -filter_complex "[0][1]amix=inputs=2[a];[2][3]amix=inputs=2[b];[a][b]concat=n=2:v=0:a=1,volume=2" \
            -ac 2 -ar 44100 /tmp/test.mp3
          docker cp musloop-ai:/tmp/test.mp3 ./test.mp3
      - name: Full check (fast + SongFormer analysis, Demucs layers, export) — offline
        run: python3 tests/fullcheck.py 8801 ./test.mp3
      - name: Logs
        if: always()
        run: docker logs musloop-ai 2>&1 | tail -80

# musloop with the neural engines (SongFormer structure analysis + Demucs layers).
#
#   CPU, any PC / Mac (~4.5 GB):
#     docker compose -f docker-compose.ai.yml up -d
#   NVIDIA GPU, Linux / Windows + NVIDIA Container Toolkit (~8 GB):
#     docker compose -f docker-compose.ai.yml -f docker-compose.cuda.yml up -d
#   -> http://localhost:8801
#
# Uses the same "musloop-data" volume as docker-compose.yml, so your tracks
# carry over. Run only one variant at a time (they share port 8801):
#   docker compose down   before switching.
services:
  musloop:
    build:
      context: .
      dockerfile: Dockerfile.ai
    image: musloop:ai
    container_name: musloop
    ports:
      # the app: this computer only (keep it on 127.0.0.1)
      - "127.0.0.1:8801:8801"
      # phone remote (Live mode → 📱 Phone): open to your Wi-Fi. Only the remote
      # page is reachable on this port, and only with the key from the QR code.
      - "8802:8802"
    volumes:
      - musloop-data:/data
      # Optional: a music folder on your disk for ☰ → Folders (add it as /music).
      # - /path/to/your/music:/music:ro
    restart: unless-stopped

volumes:
  musloop-data:

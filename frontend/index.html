      pos = (s.start + s.end) / 2;
    }
    splitAt(pos);
  };

  // Split a specific part in half (at the bar nearest to the middle)
  const splitSeg = i => {
    const s = segments[i];
    if (!s) return;
    splitAt((s.start + s.end) / 2);
  };

  const playingSeg = player.playing ? player.segIndex : -1;
  const duration = analysis ? analysis.duration : 0;

  const splitRef = useRef(splitAtPlayhead);
  splitRef.current = splitAtPlayhead;
  // hotkey handlers read the latest state through a ref (the listener is bound once)
  const keyCtx = useRef({});
  keyCtx.current = { scenes, liveMode, cueMode, applyScene, segments, setLiveMode, sceneByHotkey, applyRemoteScene, trackId,
                     liveStepTrack, setLiveTracksOpen, liveTracksOpen };

  useEffect(() => {
    const h = e => {
      const k = keyCtx.current;
      if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') {
        if (k.liveMode) return;            // live: no editing
        e.preventDefault(); undo(); return;
      }
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.code === 'Escape' && k.liveMode && k.liveTracksOpen) { e.preventDefault(); k.setLiveTracksOpen(false); return; }
      if (e.code === 'Escape' && k.liveMode) { e.preventDefault(); k.setLiveMode(false); return; }
      if (k.liveMode && (e.code === 'BracketLeft' || e.code === 'BracketRight')) {
        e.preventDefault(); k.liveStepTrack(e.code === 'BracketRight' ? 1 : -1); return;
      }
      if (k.liveMode && e.code === 'KeyT') { e.preventDefault(); k.setLiveTracksOpen(o => !o); return; }
      if (e.code === 'Space') { e.preventDefault(); player.playing ? player.stop() : player.play(); }
      if (e.code === 'ArrowRight' || e.code === 'Enter') { e.preventDefault(); player.advance(); }
      if (e.code === 'Backspace') { e.preventDefault(); player.cancelCue(); }
      if (e.code === 'KeyF' && player.playing) { e.preventDefault(); player.fadeOut(2.5); }
      if (e.code === 'KeyL') { e.preventDefault(); k.setLiveMode(v => !v); }
      // 1-9, 0: parts 1-10 (cue while playing, select/play when stopped).
      // Shift + 1-9: scenes by hotkey.
      if (/^(Digit[0-9]|Numpad[0-9])$/.test(e.code)) {
        e.preventDefault();
        const d = e.code.slice(-1);
        if (e.shiftKey) {
          const sc = k.sceneByHotkey(d);
          if (sc) (sc.track_id && sc.track_id !== k.trackId) ? k.applyRemoteScene(sc) : k.applyScene(sc);
          return;
        }
        const i = d === '0' ? 9 : +d - 1;
        if (i < k.segments.length) {
          if (!player.playing) player.play(i);
          else if (i === player.segIndex) player.cancelCue();
          else player.cue(i, k.cueMode);
        }
        return;
      }
      if (e.code === 'KeyS' && !k.liveMode) { e.preventDefault(); splitRef.current(); }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);
  // live mode: lock page scroll behind the overlay
  useEffect(() => {
    document.body.style.overflow = liveMode ? 'hidden' : '';
    return () => { document.body.style.overflow = ''; };
  }, [liveMode]);

  return (
    <div>
      <header>
        <div className="logo">
          <button className={'drawer-btn' + (drawerOpen ? ' on' : '')} onClick={() => setDrawerOpen(o => !o)}
            title={t.drawer_tip} aria-label={t.drawer_tip} aria-expanded={drawerOpen}>
            <span className="burger"><i></i><i></i><i></i></span>
          </button>
          <h1>{theme === 'tavern' ? 'Musslop' : 'musslop'}</h1>
          <div className="sub">{t.tagline}</div>
        </div>
        <div className="row" style={{ gap: 0 }}>
          <div className="theme-switch">
            <button className={theme === 'mono' ? 'on' : ''} title={t.theme_mono}
              onClick={() => setThemeState('mono')}>▪</button>
            <button className={theme === 'tavern' ? 'on' : ''} title={t.theme_tavern}
              onClick={() => setThemeState('tavern')}>⚔</button>
          </div>
          <div className="lang-switch">
            <button className={lang === 'ru' ? 'on' : ''} onClick={() => setLanguage('ru')}>RU</button>
            <button className={lang === 'en' ? 'on' : ''} onClick={() => setLanguage('en')}>EN</button>
            <button className={lang === 'zh' ? 'on' : ''} onClick={() => setLanguage('zh')}>中文</button>
          </div>
        </div>
      </header>

      <div className="panel">
        <div className="panel-title">{t.upload_title}</div>
        {/* Единая дроп-зона: принимает и аудио, и *.musslop.json; сворачивается
            в компактную строку, когда трек уже загружен */}
        {!analysis ? (
          <div className={'dropzone' + (dragOver ? ' over' : '')}
            onClick={() => fileRef.current.click()}
            onDragOver={e => { e.preventDefault(); setDragOver(true); }}
            onDragLeave={() => setDragOver(false)}
            onDrop={onDropAny}>
            <span className="dz-icon">♫</span>
            <span>{t.drop_hint}<br />
              <span style={{ fontSize: 12, opacity: .7 }}>{t.drop_formats} · *.musslop.json</span></span>
          </div>
        ) : (
          <div className={'dz-compact' + (dragOver ? ' over' : '')}
            onClick={() => fileRef.current.click()}
            onDragOver={e => { e.preventDefault(); setDragOver(true); }}
            onDragLeave={() => setDragOver(false)}
            onDrop={onDropAny}>
            <span>♫ <b>{trackName}</b></span>
            <span className="dz-compact-hint">{t.drop_compact_hint}</span>
          </div>
        )}
        <input ref={fileRef} type="file" accept="audio/*,.json" style={{ display: 'none' }}
          onChange={e => e.target.files[0] && handleAnyFile(e.target.files[0])} />
        <div className="row" style={{ marginTop: 10 }}>
          <input type="text" placeholder={t.url_placeholder} value={importUrl}
            onChange={e => setImportUrl(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && importFromUrl()}
            style={{ flex: 1, minWidth: 200, background: 'var(--panel2)', color: 'var(--text)',
                     border: '1px solid var(--border)', borderRadius: 10, padding: '9px 12px',
                     fontSize: 13.5, fontFamily: 'inherit', outline: 'none' }} />
          <button onClick={importFromUrl} disabled={!importUrl.trim() || !!loading}>
            🔗 {t.url_btn}
          </button>
        </div>
        {loading && <div className="status" style={{ marginTop: 12 }}><div className="spinner"></div>{loading}</div>}
        {error && <div className="error-box">
          <span className="x" style={{ float: 'right', marginLeft: 10, cursor: 'pointer' }}
            onClick={() => setError(null)}>✕</span>
          {t.err_prefix} {error}
        </div>}
      </div>

      {analysis && <div className="panel">
        <div className="panel-title">{t.structure_title}</div>

        {/* row 1: metrics + analysis */}
        <div className="row between" style={{ marginBottom: 10 }}>
          <div className="row">
            <span className="badge">{t.tempo} <b>{analysis.tempo.toFixed(1)} BPM</b></span>
            {(() => {
              const m = analysis.meter || {};
              const B = analysis.beats_per_bar || 4;
              const det = m.detected || B;
              const manual = m.source === 'manual';
              const legacy = m.source === 'legacy';  // old markup: grid is 4/4, detector suggests otherwise
              const low = m.confidence != null && m.confidence < 0.75 && !manual;
              const canEdit = (analysis.beats || []).length >= 8;
              return <div className="dropdown">
                <span className={'badge tip meter-badge' + (manual || legacy ? ' warn' : '')} data-tip={t.meter_tip}
                  onClick={() => canEdit && setMeterOpen(o => !o)} style={{ cursor: canEdit ? 'pointer' : 'help' }}>
                  {t.meter} <b>{meterLabel(B)}</b>
                  <span className="meter-src">{manual ? t.meter_manual : t.meter_auto}{low ? ' ?' : ''}</span>
                  {canEdit && ' ▾'}
                </span>
                {meterOpen && <div className="dropdown-menu meter-menu" style={{ left: 0, right: 'auto' }}
                  onClick={e => e.stopPropagation()}>
                  <div className="meter-info">
                    {t.meter_detected}: <b>{meterLabel(det)}</b>
                    {' · '}{m.detected_source === 'neural' ? t.meter_src_neural : t.meter_src_heuristic}
                    {m.confidence != null && m.confidence > 0 && <span> · {t.meter_conf} {Math.round(m.confidence * 100)}%</span>}
                    {low && <div style={{ color: 'var(--danger)', marginTop: 2 }}>{t.meter_low_conf}</div>}
                  </div>
                  <div className={'dropdown-item' + (!manual && !legacy ? ' on' : '')}
                    onClick={() => { setMeter(null); setMeterOpen(false); showToast(`${t.meter_changed}: ${meterLabel(det)} (${t.meter_auto})`); }}>
                    ★ {t.meter_use_auto} — {meterLabel(det)} <span className="meter-rec">{t.meter_recommended}</span>
                  </div>
                  <div className="meter-grid">
                    {METERS.map(k => <button key={k} className={(manual || legacy) && B === k ? 'on' : ''}
                      onClick={() => { setMeter(k); setMeterOpen(false); showToast(`${t.meter_changed}: ${meterLabel(k)} (${t.meter_manual})`); }}
                      title={k === det ? t.meter_recommended : ''}>
                      {meterLabel(k)}{k === det ? ' ★' : ''}</button>)}
                  </div>
                  <div className="dropdown-item" title={t.meter_shift_tip} onClick={shiftDownbeat}>⇥ {t.meter_shift}</div>
                  <div className="dropdown-item" title={t.meter_reanalyze_tip}
                    onClick={() => { setMeterOpen(false); resplitForMeter(); }}>↻ {t.meter_reanalyze}</div>
                  <div className="meter-note">{t.meter_note_68}</div>
                </div>}
              </div>;
            })()}
            <span className="badge">{t.duration} <b>{fmt(duration)}</b></span>
            <span className="badge">{t.parts} <b>{segments.length}</b>
              {analysis.n_suggested != null && <span style={{ marginLeft: 6 }}>
                · {t.n_suggested} <b>{analysis.n_suggested}</b> · {t.n_max} <b>{analysis.n_max}</b></span>}
            </span>
            {(analysis.engine === 'deep' || analysis.engine === 'songformer') &&
              <span className="badge tip" data-tip={t.ai_badge_tip}
                style={{ color: 'var(--accent)', borderColor: 'var(--accent)' }}>
                {analysis.engine === 'deep' ? '✨ All-In-One' : '⚡ SongFormer'}</span>}
            {analysis.fallback && <span className="badge" style={{ color: 'var(--danger)' }}>{t.fallback}</span>}
          </div>
          <div className="row">
            <input type="number" min="2" max="24" placeholder={t.n_parts_ph}
              value={nSeg} onChange={e => setNSeg(e.target.value)} title={t.n_parts_tip} />
            <button onClick={() => doAnalyze(trackId, nSeg ? +nSeg : null, null, manualBpb)} disabled={!!loading}>
              {t.reanalyze}
            </button>
            {deepAvailable && <button className="ai-btn tip" data-tip={t.engine_tip}
              onClick={() => doAnalyze(trackId, null, 'deep', manualBpb)} disabled={!!loading}>
              ✨ {t.ai_split_btn}
            </button>}
            {songformerAvailable && <button className="ai-btn tip" data-tip={t.songformer_tip}
              onClick={() => doAnalyze(trackId, null, 'songformer', manualBpb)} disabled={!!loading}>
              ⚡ {t.songformer_btn}
            </button>}
          </div>
        </div>

        {/* row 2: editing + files */}
        <div className="row between" style={{ marginBottom: 12 }}>
          <div className="row">
            <button onClick={splitAtPlayhead} title={t.split_tip}>{t.split_btn}</button>
            <label className="chk">
              <input type="checkbox" checked={snap} onChange={e => setSnap(e.target.checked)} />
              {t.snap}
            </label>
          </div>
          <div className="row">
            <button onClick={() => currentFav && toggleFavorite(null, currentFav)}
              disabled={!currentFav}
              title={currentFav && currentFav.favorite ? t.fav_remove_tip : t.fav_add_tip}
              style={currentFav && currentFav.favorite ? { color: '#ffb84f', borderColor: '#ffb84f66' } : {}}>
              {currentFav && currentFav.favorite ? '★ ' + t.fav_in_lib : '☆ ' + t.fav_btn}
            </button>
            <div className="dropdown">
              <button className="ghost" onClick={() => setExportOpen(o => !o)}>
                {t.files_menu} ▾
              </button>
              {exportOpen && <div className="dropdown-menu" onClick={() => setExportOpen(false)}>
                <div className="dropdown-item" onClick={() => exportLoops('generic')}>{t.export_loops}</div>
                <div className="dropdown-item" onClick={() => exportLoops('foundry')} title={t.export_foundry_tip}>{t.export_foundry}</div>
                <div className="dropdown-item" onClick={exportMarkup}>{t.export_markup}</div>
                <div className="dropdown-item" onClick={() => markupRef.current.click()}>{t.import_markup}</div>
              </div>}
            </div>
            <input ref={markupRef} type="file" accept=".json" style={{ display: 'none' }}
              onChange={e => e.target.files[0] && importMarkup(e.target.files[0])} />
          </div>
        </div>

        <Waveform buffer={buffer} segments={segments} setSegments={setSegments}
          beats={analysis.beats} downbeats={analysis.downbeats} snap={snap}
          player={player} playingSeg={playingSeg} duration={duration} t={t}
          onSeekSeg={i => {
            if (!player.playing) { player.segIndex = i; force(x => x + 1); return; }
            if (i === player.segIndex) player.cancelCue(); else player.cue(i, cueMode);
          }}
          beginEdit={beginEdit} commitEdit={commitEdit} aiWorking={aiWorking} />

        <div className="seg-list">
          {segments.map((s, i) => {
            const gi = s.group ? s.group.charCodeAt(0) - 65 : i;
            const col = SEG_COLORS[gi % SEG_COLORS.length];
            const q = s.loopability;
            const qc = q == null ? 'var(--muted)' : q > 0.75 ? '#34d399' : q > 0.55 ? '#ffb84f' : '#fb6a6a';
            const isQueued = player.pendingTarget() === i;
            return (
              <div key={i} className={'seg-chip' + (i === player.segIndex ? ' active' : '') + (isQueued ? ' queued' : '')}
                onClick={() => {
                  if (!player.playing) { player.segIndex = i; force(x => x + 1); return; }
                  if (i === player.segIndex) { player.cancelCue(); return; }
                  player.cue(i, cueMode);
                }}
                title={player.playing ? t.chip_cue_tip : t.chip_select_tip}>
                <div className="dot" style={{ background: col }}></div>
                {i < 10 && <kbd className="chip-key" title={t.part_hotkey_tip}>{(i + 1) % 10}</kbd>}
                <input value={s.label} onClick={e => e.stopPropagation()}
                  onChange={e => setSegments(segs => {
                    const ns = segs.map(x => ({ ...x }));
                    ns[i].label = e.target.value; return ns;
                  })} />
                <span className="time">{fmt(s.start)}–{fmt(s.end)}</span>
                {q != null && <span className="time" title={t.loop_quality_tip}
                  style={{ color: qc }}>⟳{Math.round(q * 100)}%</span>}
                {isQueued && <span className="time" style={{ color: 'var(--accent)' }}>{t.queued_badge}</span>}
                <span className="x" title={t.loop_toggle_tip}
                  style={{ color: s.loop === false ? 'var(--danger)' : 'var(--accent2)' }}
                  onClick={e => {
                    e.stopPropagation();
                    setSegments(segs => {
                      const ns = segs.map(x => ({ ...x }));
                      ns[i].loop = ns[i].loop === false;
                      ns[i].transition = !ns[i].loop;
                      return ns;
                    });
                  }}>{s.loop === false ? '→' : '⟳'}</span>
                {s.loop === false && <span className="time"
                  style={{ color: 'var(--danger)' }}>{t.transition_badge}</span>}
                <span className="x tip" data-tip={t.audition_seam_tip}
                  style={{ color: player.previewing ? 'var(--accent)' : 'var(--muted)' }}
                  onClick={e => { e.stopPropagation(); player.previewSeam(i); }}>⟲♪</span>
                {i + 1 < segments.length && <span className="x tip" data-tip={t.audition_next_tip}
                  onClick={e => { e.stopPropagation(); player.previewTransition(i, i + 1); }}>→♪</span>}
                <span className="x tip" data-tip={t.stinger_tip}
                  style={{ color: (s.stinger && s.stinger !== 'none') ? 'var(--accent)' : 'var(--muted)' }}
                  onClick={e => {
                    e.stopPropagation();
                    setStingerMenu(stingerMenu === i ? null : i);
                  }}>♪{s.stinger && s.stinger !== 'none' ? '•' : ''}</span>
                {stingerMenu === i && <div className="dropdown-menu"
                  style={{ top: 'calc(100% + 4px)', left: 'auto', right: 0 }}
                  onClick={e => e.stopPropagation()}>
                  {['none', 'cymbal', 'boom', 'riser'].map(sg => (
                    <div key={sg}
                      className="dropdown-item"
                      style={s.stinger === sg || (!s.stinger && sg === 'none')
                        ? { color: 'var(--accent)' } : {}}
                      onClick={() => {
                        setSegments(segs => {
                          const ns = segs.map(x => ({ ...x }));
                          ns[i].stinger = sg === 'none' ? undefined : sg;
                          return ns;
                        });
                        setStingerMenu(null);
                        // sound preview on selection
                        if (sg !== 'none' && player.ctx && player.stingerBuffers[sg]) {
                          player._playStinger(sg, player.ctx.currentTime + 0.05);
                        }
                      }}>
                      {t['stinger_' + sg]}{sg !== 'none' ? ' ♪' : ''}
                    </div>
                  ))}
                </div>}
                <span className="x" title={t.split_seg_tip}
                  onClick={e => { e.stopPropagation(); splitSeg(i); }}>✂</span>
                <span className="x" title={t.del_seg}
                  onClick={e => { e.stopPropagation(); removeSeg(i); }}>✕</span>
              </div>
            );
          })}
        </div>
      </div>}

      {analysis && <div className="panel">
        <div className="row between">
          <div className="panel-title" style={{ marginBottom: 0 }}>{t.player_title}</div>
          <button className="ghost" onClick={() => setLiveMode(true)} title={t.live_tip}>⛶ {t.live_btn}</button>
        </div>
        <div className="row between" style={{ marginTop: 12 }}>
          <div className="row">
            {!player.playing
              ? <button className="primary" onClick={() => player.play()}>{t.play}</button>
              : <button onClick={() => player.stop()}>{t.stop}</button>}
            <button className={'go' + (player.advanceArmed ? ' armed' : '')}
              disabled={!player.playing || player.segIndex >= segments.length - 1}
              onClick={() => player.advance()}>
              {player.advanceArmed ? t.next_armed : t.next}
            </button>
            {player.pendingTarget() != null &&
              <button className="ghost" onClick={() => player.cancelCue()} title={t.cancel_cue_tip}>
                ✕ {t.cancel_cue}
              </button>}
            {player.previewing && <span className="status"><span className="eq"><i></i><i></i><i></i></span>{t.previewing}
              <span className="x" onClick={() => player.stopPreview()}>■</span></span>}
          </div>
          <div className="now">
            {player.playing && <span className="eq"><i></i><i></i><i></i></span>}
            {player.playing
              ? <span>{t.playing} <b>{segments[player.segIndex] ? segments[player.segIndex].label : '–'}</b>
                  &nbsp;· {t.pass}{player.loopCount}{t.pass_suffix || ''}
                  {(() => {
                    const tgt = player.pendingTarget();
                    if (tgt == null || !segments[tgt]) return null;
                    const eta = player.transitionEta();
                    return <span> → <b>{segments[tgt].label}</b>{eta != null && <span className="time" style={{ marginLeft: 6 }}>{eta.toFixed(0)}s</span>}</span>;
                  })()}</span>
              : <span>{t.selected} <b>{segments[player.segIndex] ? segments[player.segIndex].label : '–'}</b></span>}
          </div>
        </div>
        {/* row: transition */}
        <div className="row" style={{ marginTop: 12 }}>
          <span className="badge tip" data-tip={t.cue_mode_tip}>{t.trans_mode}</span>
          <div className="lang-switch">
            <button className={cueMode === 'natural' ? 'on' : ''}
              onClick={() => setCueMode('natural')} title={t.cue_natural_tip}>{t.cue_natural}</button>
            <button className={cueMode === 'soon' ? 'on' : ''}
              onClick={() => setCueMode('soon')} title={t.cue_soon_tip}>{t.cue_soon}</button>
            <button className={cueMode === 'now' ? 'on' : ''}
              onClick={() => setCueMode('now')} title={t.cue_now_tip}>{t.cue_now}</button>
          </div>
          {cueMode === 'soon' && <div className="lang-switch" title={t.phrase_len_tip}>
            <button className={phraseBars === 4 ? 'on' : ''}
              onClick={() => setPhraseBars(4)}>4 {t.bars}</button>
            <button className={phraseBars === 8 ? 'on' : ''}
              onClick={() => setPhraseBars(8)}>8 {t.bars}</button>
          </div>}
          <span className="badge tip" style={{ marginLeft: 12 }} data-tip={t.crossfade_tip}>{t.crossfade}</span>
          <input type="range" min="0" max="2" step="0.1" value={crossfade}
            style={{ width: 130, accentColor: 'var(--accent)' }}
            onChange={e => setCrossfade(+e.target.value)} />
          <span className="time" style={{ fontFamily: '"JetBrains Mono", monospace', fontSize: 12, color: 'var(--muted)' }}>
            {crossfade.toFixed(1)}s
          </span>
          <span className="badge tip" style={{ marginLeft: 12 }} data-tip={t.speed_tip}>{t.speed}</span>
          <input type="range" min="0.5" max="1.5" step="0.05" value={rate}
            style={{ width: 110, accentColor: 'var(--accent)' }}
            onChange={e => { const v = +e.target.value; setRateState(v); player.setRate(v); }} />
          <span className="time" style={{ fontFamily: '"JetBrains Mono", monospace', fontSize: 12,
                 color: rate !== 1 ? 'var(--accent)' : 'var(--muted)', cursor: 'pointer' }}
            title={t.speed_reset_tip}
            onClick={() => { setRateState(1); player.setRate(1); }}>
            {analysis ? Math.round(analysis.tempo * rate) + ' bpm' : 'x' + rate.toFixed(2)}
          </span>
        </div>
        {/* row: smoothing + stinger */}
        <div className="row" style={{ marginTop: 10 }}>
          <label className="chk tip" data-tip={t.tail_tip}>
            <input type="checkbox" checked={tailOn}
              onChange={e => { setTailOn(e.target.checked); player.tailEnabled = e.target.checked; }} />
            {t.tail_label}
          </label>
          <label className="chk tip" data-tip={t.bass_swap_tip}>
            <input type="checkbox" checked={bassSwapOn}
              onChange={e => { setBassSwapOn(e.target.checked); player.bassSwap = e.target.checked; }} />
            {t.bass_swap_label}
          </label>
          <span className="badge tip" style={{ marginLeft: 12 }} data-tip={t.reverb_tip}>{t.reverb}</span>
          <input type="range" min="0" max="1" step="0.01" value={reverbAmt}
            style={{ width: 130, accentColor: 'var(--accent)' }}
            onChange={e => setReverbAmt(+e.target.value)} />
          <span className="time" style={{ fontFamily: '"JetBrains Mono", monospace', fontSize: 12,
                 color: reverbAmt > 0 ? 'var(--accent)' : 'var(--muted)', cursor: 'pointer' }}
            onClick={() => setReverbAmt(0)}>
            {Math.round(reverbAmt * 100)}%
          </span>
        </div>
        {/* row: layers (vertical layering) */}
        {(deepAvailable || songformerAvailable) && <div className="row" style={{ marginTop: 10, alignItems: 'flex-start' }}>
          <span className="badge tip" data-tip={t.stems_tip}>{t.stems_label}</span>
          {stemsState !== 'ready'
            ? <button className="ai-btn" onClick={loadStems}
                disabled={stemsState === 'loading' || !!loading}>
                {stemsState === 'loading' ? t.stems_working : t.stems_btn}
              </button>
            : <React.Fragment>
                <div className="layer-grid">
                  {['drums', 'bass', 'other', 'vocals'].map(name => (
                    <div key={name} className={'layer-row' + (layers[name].on ? '' : ' off')}>
                      <label className="chk">
                        <input type="checkbox" checked={layers[name].on}
                          onChange={e => updateLayer(name, { on: e.target.checked })} />
                        <span className="layer-name">{t['layer_' + name]}</span>
                      </label>
                      <input type="range" min="0" max="1.5" step="0.01"
                        value={layers[name].vol}
                        disabled={!layers[name].on}
                        style={{ width: 110, accentColor: '#a06bff' }}
                        onChange={e => updateLayer(name, { vol: +e.target.value })} />
                      <span className="vol-num">{Math.round(layers[name].vol * 100)}%</span>
                    </div>
                  ))}
                </div>
                <button className="ghost" onClick={unloadStems}>{t.stems_off}</button>
              </React.Fragment>}
        </div>}
        <div className="hint">{t.keys_hint}</div>
      </div>}

      {(analysis || otherSceneGroups.length > 0) && <div className="panel">
        <div className="row between">
          <div className="row">
            <div className="panel-title" style={{ marginBottom: 0 }}>{t.scenes_title}</div>
            <span className="count">({scenes.length + otherSceneGroups.reduce((n, g) => n + g.scenes.length, 0)})</span>
          </div>
          <div className="row">
            <button className="primary" onClick={() => captureScene()} title={t.scene_capture_tip}
              disabled={!analysis || !segments[player.segIndex]}>
              + {t.scene_capture}
            </button>
          </div>
        </div>
        <div className="hint" style={{ marginTop: 6 }}>{t.scenes_hint}</div>
        {scenes.length > 0 && <div className="scene-grid">
          {scenes.map(sc => {
            const seg = segments[sc.segIndex];
            const isActive = player.playing && sc.segIndex === player.segIndex;
            const isQueued = player.pendingTarget() === sc.segIndex;
            const col = seg ? SEG_COLORS[(seg.group ? seg.group.charCodeAt(0) - 65 : sc.segIndex) % SEG_COLORS.length] : 'var(--muted)';
            const layerSummary = sc.layers
              ? ['drums', 'bass', 'other', 'vocals'].filter(n => sc.layers[n] && sc.layers[n].on).map(n => t['layer_' + n][0]).join('')
              : null;
            return (
              <div key={sc.id} className={'scene-card' + (isActive ? ' active' : '') + (isQueued ? ' queued' : '') + (sceneMenu === sc.id ? ' open' : '')}
                style={{ '--scene-col': col }}
                onClick={() => sceneMenu === sc.id ? null : applyScene(sc)}>
                <div className="scene-head">
                  {sc.hotkey && <kbd>⇧{sc.hotkey}</kbd>}
                  <input className="scene-name" value={sc.name}
                    onClick={e => e.stopPropagation()}
                    onChange={e => updateScene(sc.id, { name: e.target.value })} />
                  <span className="x" onClick={e => { e.stopPropagation(); setSceneMenu(sceneMenu === sc.id ? null : sc.id); }}>⋯</span>
                </div>
                <div className="scene-meta">
                  <span className="dot" style={{ background: col }}></span>
                  <span>{seg ? seg.label : '–'}</span>
                  {layerSummary != null && <span className="time" title={t.scene_layers_tip}>▤ {layerSummary || '—'}</span>}
                  {sc.rate != null && sc.rate !== 1 && <span className="time">×{sc.rate.toFixed(2)}</span>}
                  {sc.reverb > 0 && <span className="time">≋{Math.round(sc.reverb * 100)}%</span>}
                  <span className="time">{t['cue_' + (sc.cueMode || 'natural')]}</span>
                </div>
                {isActive && <div className="scene-state">{t.scene_on_air}</div>}
                {isQueued && <div className="scene-state">{t.queued_badge}</div>}
                {sceneMenu === sc.id && <div className="scene-menu" onClick={e => e.stopPropagation()}>
                  <div className="dropdown-item" onClick={() => { applyScene(sc, 'now'); setSceneMenu(null); }}>{t.scene_go_now}</div>
                  <div className="dropdown-item" onClick={() => {
                    // overwrite the scene with the current player state
                    updateScene(sc.id, {
                      segIndex: player.segIndex,
                      layers: stemsState === 'ready' ? JSON.parse(JSON.stringify(layers)) : sc.layers,
                      rate, crossfade, reverb: reverbAmt, cueMode,
                    });
                    setSceneMenu(null); showToast(t.scene_updated);
                  }}>{t.scene_update}</div>
                  <div className="dropdown-item row-item">
                    {t.scene_hotkey} (⇧) <select value={sc.hotkey || ''}
                      onChange={e => { updateScene(sc.id, { hotkey: e.target.value || null }); }}>
                      <option value="">—</option>
                      {'123456789'.split('').map(k => <option key={k} value={k}
                        disabled={scenes.some(o => o.id !== sc.id && o.hotkey === k)}>{k}</option>)}
                    </select>
                  </div>
                  <div className="dropdown-item row-item">
                    {t.trans_mode} <select value={sc.cueMode || 'natural'}
                      onChange={e => updateScene(sc.id, { cueMode: e.target.value })}>
                      {['natural', 'soon', 'now'].map(m => <option key={m} value={m}>{t['cue_' + m]}</option>)}
                    </select>
                  </div>
                  <div className="dropdown-item" style={{ color: 'var(--danger)' }}
                    onClick={() => { removeScene(sc.id); setSceneMenu(null); }}>✕ {t.scene_delete}</div>
                </div>}
              </div>
            );
          })}
        </div>}
        {analysis && scenes.length > 0 && otherSceneGroups.length > 0 && <div className="scene-track-head" style={{ marginTop: 14 }}>{t.scenes_this_track}: <b>{trackName}</b></div>}
        {otherSceneGroups.map(g => (
          <div key={g.track_id} className="scene-track">
            <div className="scene-track-head">{t.scenes_other_track} <b>{g.track_name}</b>
              <span className="count">({g.scenes.length})</span></div>
            <div className="scene-grid">
              {g.scenes.map(sc => (
                <div key={sc.id} className="scene-card remote" onClick={() => applyRemoteScene(sc)} title={t.scene_remote_tip}>
                  <div className="scene-head">
                    {sc.hotkey && <kbd>⇧{sc.hotkey}</kbd>}
                    <span className="scene-name">{sc.name}</span>
                  </div>
                  <div className="scene-meta">
                    <span>{sc.part_label || `#${sc.segIndex + 1}`}</span>
                    <span className="time">{t['cue_' + (sc.cueMode || 'natural')]}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>}

      {/* ---- side drawer: projects · library · music folders ---- */}
      {drawerOpen && <div className="drawer-backdrop" onClick={() => setDrawerOpen(false)} />}
      <aside className={'drawer' + (drawerOpen ? ' open' : '')}>
        <div className="drawer-head">
          <button className="drawer-btn on" onClick={() => setDrawerOpen(false)} title={t.drawer_close}
            aria-label={t.drawer_close}>
            <span className="burger"><i></i><i></i><i></i></span>
          </button>
          <div className="lang-switch">
            {[['projects', t.project_title], ['library', t.drawer_library], ['folders', t.drawer_folders]].map(([k, lbl]) =>
              <button key={k} className={drawerTab === k ? 'on' : ''} onClick={() => setDrawerTab(k)}>{lbl}</button>)}
          </div>
        </div>
        <div className="drawer-body">
          {drawerTab === 'projects' && <React.Fragment>
      <div className="drawer-section">
            <div className="row between">
              <div className="row">
                <div className="panel-title" style={{ marginBottom: 0 }}>{t.project_title}</div>
                {project && <input className="proj-name" value={project.name}
                  onChange={e => editProject(p => ({ ...p, name: e.target.value }))} />}
              </div>
              <div className="row">
                {projects.length > 0 && <select className="proj-select" value={project ? project.id : ''}
                  onChange={e => e.target.value ? openProject(e.target.value) : (setProject(null), localStorage.removeItem('musslop_project'))}>
                  <option value="">{t.project_none}</option>
                  {projects.map(p => <option key={p.id} value={p.id}>{p.name} · {p.n_items}</option>)}
                </select>}
                <button onClick={createProject}>+ {t.project_new}</button>
                {project && <button className="ghost" title={t.project_delete_tip}
                  onClick={() => confirm(`${t.project_delete_confirm} "${project.name}"?`) && deleteProject(project.id)}>✕</button>}
              </div>
            </div>
            {!project && <div className="hint" style={{ marginTop: 8 }}>{t.project_hint}</div>}
            {project && <div className="proj-groups">
              {project.groups.map((g, gi) => (
                <div key={g.id} className="proj-group">
                  <div className="proj-group-head">
                    <input className="proj-group-name" value={g.name} onChange={e => renameGroup(g.id, e.target.value)} />
                    <span className="count">({g.items.length})</span>
                    <span className="x" title={t.project_move_up} onClick={() => moveGroup(g.id, -1)}>↑</span>
                    <span className="x" title={t.project_move_down} onClick={() => moveGroup(g.id, 1)}>↓</span>
                    {trackId && <button className="ghost small" onClick={() => addItem(g.id)} title={t.project_add_track_tip}>+ ♫ {t.project_add_track}</button>}
                    {trackId && scenes.length > 0 && <select className="proj-select small" value=""
                      onChange={e => { if (e.target.value) addItem(g.id, e.target.value); }}>
                      <option value="">+ {t.project_add_scene}</option>
                      {scenes.map(sc => <option key={sc.id} value={sc.id}>{sc.name}</option>)}
                    </select>}
                    <span className="x" style={{ marginLeft: 'auto' }} title={t.project_group_delete}
                      onClick={() => (g.items.length === 0 || confirm(t.project_group_delete_confirm)) && removeGroup(g.id)}>✕</span>
                  </div>
                  {g.items.length === 0 && <div className="hint" style={{ margin: '4px 0 0 14px' }}>{t.project_group_empty}</div>}
                  {g.items.map(it => {
                    const isCur = it.track_id === trackId && (!it.scene_id || (player.playing && (scenes.find(s => s.id === it.scene_id) || {}).segIndex === player.segIndex));
                    return (
                      <div key={it.id} className={'proj-item' + (isCur ? ' active' : '') + (it.available === false ? ' missing' : '')}
                        onClick={() => openItem(it)} title={t.project_item_open_tip}>
                        <span className="proj-item-icon">{it.scene_id ? '◈' : '♫'}</span>
                        <span className="proj-item-name">
                          {it.scene_id ? <span>{it.scene_name || '?'} <span className="time">· {it.track_name || it.track_id}</span></span>
                            : (it.track_name || it.track_id)}
                          {it.available === false && <span className="time" style={{ color: 'var(--danger)', marginLeft: 6 }}>{t.project_item_missing}</span>}
                        </span>
                        <input className="proj-note" placeholder={t.project_note_ph} value={it.note || ''}
                          onClick={e => e.stopPropagation()} onChange={e => noteItem(g.id, it.id, e.target.value)} />
                        <span className="x" onClick={e => { e.stopPropagation(); moveItem(g.id, it.id, -1); }}>↑</span>
                        <span className="x" onClick={e => { e.stopPropagation(); moveItem(g.id, it.id, 1); }}>↓</span>
                        <span className="x" onClick={e => { e.stopPropagation(); removeItem(g.id, it.id); }}>✕</span>
                      </div>
                    );
                  })}
                </div>
              ))}
              <button className="ghost" onClick={addGroup}>+ {t.project_add_group}</button>
            </div>}
          </div>
    
          </React.Fragment>}
          {drawerTab === 'library' && <div className="drawer-section">
            {history.length === 0 && <div className="hint">{t.drawer_library_empty}</div>}
            {history.length > 0 && <div>
              {[
                { key: 'lib', title: t.library_title, items: history.filter(h => h.favorite) },
                { key: 'hist', title: t.history_title, items: history.filter(h => !h.favorite) },
              ].map(group => group.items.length > 0 && (
                <div key={group.key} style={{ marginBottom: 6 }}>
                  <div className="collapse-head"
                    onClick={() => setOpenGroups(o => ({ ...o, [group.key]: !o[group.key] }))}>
                    <span className={'caret' + (openGroups[group.key] ? ' open' : '')}>▶</span>
                    <div className="panel-title" style={{ marginBottom: 0 }}>{group.title}</div>
                    <span className="count">({group.items.length})</span>
                  </div>
                  {openGroups[group.key] && <div className="seg-list" style={{ marginTop: 6 }}>
                    {group.items.map(item => (
                      <div key={item.track_id}
                        className={'seg-chip' + (item.track_id === trackId ? ' active' : '')}
                        onClick={() => openFromHistory(item)}
                        title={t.history_open_tip}>
                        <span className="x" style={{ color: item.favorite ? '#ffb84f' : 'var(--muted)', fontSize: 14 }}
                          title={item.favorite ? t.fav_remove_tip : t.fav_add_tip}
                          onClick={e => toggleFavorite(e, item)}>{item.favorite ? '★' : '☆'}</span>
                        <span style={{ fontSize: 13 }}>{item.has_markup ? '💾' : '♫'}</span>
                        <span style={{ fontWeight: 600, maxWidth: 220, overflow: 'hidden',
                                       textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{item.name}</span>
                        {item.duration != null && <span className="time">{fmt(item.duration)}</span>}
                        {item.n_segments > 0 && <span className="time">{item.n_segments} {t.history_parts}</span>}
                        <span className="x" title={t.history_del_tip}
                          onClick={e => deleteFromHistory(e, item)}>✕</span>
                      </div>
                    ))}
                  </div>}
                </div>
              ))}
            </div>}

          </div>}
          {drawerTab === 'folders' && <div className="drawer-section">
            <div className="hint" style={{ marginBottom: 8 }}>{t.folders_hint}</div>
            <div className="row">
              <input type="text" className="folder-input" placeholder={t.folders_ph} value={folderInput}
                onChange={e => setFolderInput(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && addFolder()} />
              <button onClick={addFolder} disabled={!folderInput.trim()}>+ {t.folders_add}</button>
              <button className="ghost" onClick={pickFolder} disabled={picking} title={t.folders_browse_tip}>{picking ? '…' : '📂 ' + t.folders_browse}</button>
            </div>
            {folderError && <div className="error-box">{folderError}</div>}
            {selectedList.length > 0 && <div className="sel-bar">
              <b>{selectedList.length}</b> {t.folders_selected}
              <select className="proj-select small" value="" onChange={e => { if (e.target.value) addSelectedToProject(e.target.value); }}>
                <option value="">{t.folders_to_group}</option>
                {project && project.groups.map(g => <option key={g.id} value={g.id}>{project.name} · {g.name}</option>)}
                <option value="__new__">+ {t.project_add_group}{project ? '' : ` (${t.project_new})`}</option>
              </select>
              <span className="x" onClick={() => setSelectedFiles({})}>✕</span>
            </div>}
            {folders.map(f => (
              <div key={f.path} className="folder">
                <div className="folder-head" onClick={() => toggleFolder(f.path)}>
                  <span className={'caret' + (openFolders[f.path] ? ' open' : '')}>▶</span>
                  <span className="folder-path" title={f.path}>{f.path}</span>
                  {!f.exists && <span className="time" style={{ color: 'var(--danger)' }}>{t.folders_missing}</span>}
                  {folderFiles[f.path] && <span className="count">({folderFiles[f.path].length})</span>}
                  <span className="x" title={t.folders_rescan} onClick={e => { e.stopPropagation(); scanFolder(f.path); }}>↻</span>
                  <span className="x" title={t.folders_remove} onClick={e => { e.stopPropagation(); removeFolder(f.path); }}>✕</span>
                </div>
                {openFolders[f.path] && <div className="folder-files">
                  {folderFiles[f.path] === undefined && <div className="status"><div className="spinner"></div>{t.folders_scanning}</div>}
                  {folderFiles[f.path] && folderFiles[f.path].length === 0 && <div className="hint">{t.folders_none}</div>}
                  {(folderFiles[f.path] || []).map(file => {
                    const isPrev = previewPath === file.path;
                    const a = previewRef.current;
                    const prog = isPrev && a && a.duration ? previewPos / a.duration : 0;
                    return (
                      <div key={file.path} className={'folder-file' + (file.track_id && file.track_id === trackId ? ' active' : '') + (isPrev ? ' previewing' : '') + (selectedFiles[file.path] ? ' selected' : '')}
                        title={file.path}>
                        <input type="checkbox" className="ff-check" checked={!!selectedFiles[file.path]} onChange={() => toggleSelect(file)} title={t.folders_select_tip} />
                        <div className="ff-cover" onClick={() => toggleFilePreview(file)} title={isPrev ? t.folders_stop : t.folders_listen}>
                          {file.has_cover && <img src={`/api/folders/cover?path=${encodeURIComponent(file.path)}`} alt="" loading="lazy" />}
                          <span className="ff-play">{isPrev ? '■' : '▶'}</span>
                        </div>
                        <div className="ff-text" onClick={() => toggleFilePreview(file)}>
                          <div className="ff-title">{file.title || file.name.replace(/\.[^.]+$/, '')}</div>
                          <div className="ff-sub">
                            {file.artist && <span>{file.artist} · </span>}
                            {file.duration != null && <span>{fmt(file.duration)} · </span>}
                            <span>{(file.size / 1048576).toFixed(1)} MB</span>
                            {file.has_markup ? <span> · 💾</span> : file.track_id ? <span> · ♫</span> : null}
                          </div>
                          {isPrev && <div className="ff-bar" onClick={e => { e.stopPropagation(); seekFilePreview(e, file); }}><div style={{ width: `${prog * 100}%` }}></div></div>}
                        </div>
                        <button className="ff-go" onClick={() => { stopFilePreview(); openFolderFile(f.path, file); }} title={t.folders_take_tip}>→</button>
                      </div>
                    );
                  })}
                </div>}
              </div>
            ))}
          </div>}
        </div>
      </aside>

      <footer>{t.footer} · <a href="https://github.com/Siziff/musslop" target="_blank">GitHub</a></footer>

      {liveMode && analysis && (() => {
        const cur = segments[player.segIndex];
        const tgt = player.pendingTarget();
        const eta = player.transitionEta();
        const items = [
          ...scenes.map(sc => ({ kind: 'scene', sc, segIndex: sc.segIndex, name: sc.name, hotkey: sc.hotkey ? '⇧' + sc.hotkey : null })),
          ...allScenes.filter(sc => sc.track_id !== trackId).map(sc => ({ kind: 'remote', sc, segIndex: -1, name: sc.name, sub: sc.track_name,
            hotkey: sc.hotkey && !scenes.some(o => o.hotkey === sc.hotkey) ? '⇧' + sc.hotkey : null })),
          ...segments.map((s, i) => ({ kind: 'seg', segIndex: i, name: s.label, hotkey: i < 10 ? String((i + 1) % 10) : null })),
        ];
        return (
          <div className="live">
            <div className="live-top">
              <div className="live-title">⛶ {t.live_title}
                <div className="live-track">
                  <button className="ghost" title={t.live_prev_track + ' ['} disabled={!!liveSwitching || liveCurIndex <= 0 && liveCurIndex !== -1}
                    onClick={() => liveStepTrack(-1)}>◀</button>
                  <button className={'live-track-name' + (liveTracksOpen ? ' on' : '')} title={t.live_tracks_tip + ' (T)'}
                    onClick={() => setLiveTracksOpen(o => !o)}>
                    <span className="nm">{liveSwitching ? `${t.live_switching} ${liveSwitching}` : trackName}</span>
                    {liveTrackList.items.length > 0 && liveCurIndex >= 0 &&
                      <span className="time">{liveCurIndex + 1}/{liveTrackList.items.length}</span>}
                    <span>▾</span>
                  </button>
                  <button className="ghost" title={t.live_next_track + ' ]'} disabled={!!liveSwitching || liveCurIndex >= liveTrackList.items.length - 1}
                    onClick={() => liveStepTrack(1)}>▶</button>
                </div>
              </div>
              <div className="row">
                <div className="lang-switch">
                  {['natural', 'soon', 'now'].map(m => <button key={m} className={cueMode === m ? 'on' : ''}
                    onClick={() => setCueMode(m)}>{t['cue_' + m]}</button>)}
                </div>
                <button className="ghost" onClick={() => setLiveMode(false)}>✕ {t.live_exit} <kbd>Esc</kbd></button>
              </div>
            </div>
            {liveTracksOpen && <div className="live-tracks">
              <div className="live-tracks-head">
                <span className="live-label">{liveTrackList.source === 'project' ? `${t.live_tracks_project}: ${project.name}` : t.live_tracks_library}</span>
                <input autoFocus type="text" placeholder={t.live_tracks_filter} value={liveTrackFilter}
                  onChange={e => setLiveTrackFilter(e.target.value)}
                  onKeyDown={e => {
                    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); liveTrackFilter ? setLiveTrackFilter('') : setLiveTracksOpen(false); }
                    if (e.key === 'Enter') {
                      const f = liveTrackFilter.trim().toLowerCase();
                      const first = liveTrackList.items.find(x => !f || (x.name || '').toLowerCase().includes(f) || (x.sub || '').toLowerCase().includes(f));
                      if (first) liveOpenTrack(first);
                    }
                  }} />
                <span className="hint" style={{ margin: 0 }}>{t.live_tracks_hint}</span>
              </div>
              {liveTrackList.items.length === 0 && <div className="hint">{t.drawer_library_empty}</div>}
              <div className="live-tracks-list">
                {(() => {
                  const f = liveTrackFilter.trim().toLowerCase();
                  let lastGroup = null;
                  return liveTrackList.items.map((x, i) => {
                    if (f && !(x.name || '').toLowerCase().includes(f) && !(x.sub || '').toLowerCase().includes(f)) return null;
                    const head = x.group != null && x.group !== lastGroup ? <div key={'g' + i} className="live-tracks-group">{x.group}</div> : null;
                    lastGroup = x.group;
                    const cur = i === liveCurIndex;
                    return <React.Fragment key={x.key}>
                      {head}
                      <button className={'live-track-item' + (cur ? ' on' : '')} disabled={!!liveSwitching}
                        onClick={() => liveOpenTrack(x)}>
                        <span className="num">{i + 1}</span>
                        {x.fav && <span style={{ color: '#ffb84f' }}>★</span>}
                        <span className="nm">{x.name}</span>
                        {x.sub && <span className="time">{x.sub}</span>}
                        {cur && <span className="time" style={{ color: 'var(--accent2)' }}>{player.playing ? t.scene_on_air : t.live_loaded}</span>}
                      </button>
                    </React.Fragment>;
                  });
                })()}
              </div>
            </div>}
            <div className="live-stage">
              <div className="live-now">
                <div className="live-label">{player.playing ? t.live_now : t.live_ready}</div>
                <div className="live-name">{cur ? cur.label : '–'}</div>
                <div className="live-sub">
                  {player.playing && <span className="eq"><i></i><i></i><i></i></span>}
                  {player.playing ? `${t.pass}${player.loopCount}` : t.live_press_play}
                </div>
              </div>
              <div className={'live-next' + (tgt != null ? ' armed' : '')}>
                <div className="live-label">{t.live_next}</div>
                <div className="live-name">{tgt != null && segments[tgt] ? segments[tgt].label : '—'}</div>
                <div className="live-sub">{tgt != null
                  ? (eta != null ? `${t.live_in} ${Math.max(0, eta).toFixed(0)} s` : t.live_at_boundary)
                  : t.live_pick}</div>
              </div>
            </div>
            <div className="live-grid">
              {items.map((it, k) => {
                const firstSeg = it.kind === 'seg' && (k === 0 || items[k - 1].kind !== 'seg');
                const isOn = player.playing && it.segIndex === player.segIndex;
                const isQ = tgt != null && it.segIndex === tgt;
                const seg = segments[it.segIndex];
                const col = seg ? SEG_COLORS[(seg.group ? seg.group.charCodeAt(0) - 65 : it.segIndex) % SEG_COLORS.length] : 'var(--muted)';
                return (
                  <button key={k} className={'live-pad' + (isOn ? ' on' : '') + (isQ ? ' queued' : '') + (it.kind !== 'seg' ? ' scene' : '') + (it.kind === 'remote' ? ' remote' : '') + (firstSeg && k > 0 ? ' first-seg' : '')}
                    style={{ '--scene-col': col }}
                    onClick={() => {
                      if (it.kind === 'remote') applyRemoteScene(it.sc);
                      else if (it.kind === 'scene') applyScene(it.sc);
                      else if (!player.playing) player.play(it.segIndex);
                      else if (it.segIndex === player.segIndex) player.cancelCue();
                      else player.cue(it.segIndex, cueMode);
                    }}>
                    {it.hotkey && <kbd>{it.hotkey}</kbd>}
                    <span className="live-pad-name">{it.name}</span>
                    <span className="live-pad-sub">{isOn ? t.scene_on_air : isQ ? t.queued_badge : it.sub ? it.sub : (seg ? fmt(seg.end - seg.start) : '')}</span>
                  </button>
                );
              })}
            </div>
            <div className="live-bar">
              {!player.playing
                ? <button className="primary big" onClick={() => player.play()}>▶ {t.live_play}</button>
                : <button className="big" onClick={() => player.fadeOut(2.5)}>◢ {t.live_fade} <kbd>F</kbd></button>}
              <button className={'go big' + (player.advanceArmed ? ' armed' : '')}
                disabled={!player.playing || player.segIndex >= segments.length - 1}
                onClick={() => player.advance()}>{t.next} <kbd>→</kbd></button>
              <button className="big" disabled={!player.playing || (tgt == null)}
                onClick={() => player.cancelCue()}>✕ {t.cancel_cue} <kbd>Bksp</kbd></button>
              <div className="live-vol">
                <span>{volume === 0 ? '🔇' : '🔊'}</span>
                <input type="range" min="0" max="1" step="0.01" value={volume}
                  onChange={e => setVolume(+e.target.value)} />
              </div>
              <div className="hint">{t.live_keys}</div>
            </div>
          </div>
        );
      })()}

      {toast && <div className="toast">{toast}</div>}

      <div className="volume-box" title={t.volume_tip}>
        <span className="vol-icon" onClick={() => setVolume(volume > 0 ? 0 : 1)}>
          {volume === 0 ? '🔇' : volume < 0.5 ? '🔉' : '🔊'}
        </span>
        <input type="range" min="0" max="1" step="0.01" value={volume}
          onChange={e => setVolume(+e.target.value)} />
        <span className="vol-num">{Math.round(volume * 100)}%</span>
        <span className="vol-icon" title={t.beep_tip}
          onClick={() => {
            // test beep straight to destination, bypassing master/stems/filters;
            // must survive even if the player graph is broken
            try { player._ensureCtx(); } catch (e) {}
            try {
              const ctx = player.ctx || new (window.AudioContext || window.webkitAudioContext)();
              if (ctx.state === 'suspended') ctx.resume();
              const o = ctx.createOscillator();
              const g = ctx.createGain();
              g.gain.value = 0.25;
              o.frequency.value = 660;
              o.connect(g); g.connect(ctx.destination);
              o.start(); o.stop(ctx.currentTime + 0.25);
            } catch (e) {}
            setTimeout(() => force(x => x + 1), 300);
          }}>♪?</span>
        {player.ctx && player.ctx.state !== 'running' &&
          <span className="vol-num" style={{ color: 'var(--danger)', width: 'auto' }}>
            {player.ctx.state}
          </span>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Musslop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0d14'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%236a8dff'%3E%E2%99%AB%3C/text%3E%3C/svg%3E">
<script src="vendor/react.min.js"></script>
<script src="vendor/react-dom.min.js"></script>
<script src="vendor/babel.min.js"></script>
<style>
  /* ============ THEME: mono (default) — brutalist monochrome ============ */
  :root, [data-theme="mono"] {
    --bg: #111111; --panel: #171717; --panel2: #1f1f1f;
    --text: #f2f2f2; --muted: #7a7a7a;
    --accent: #d8ff3e; --accent2: #d8ff3e; --danger: #ff6b6b;
    --border: #2c2c2c; --border-soft: #232323;
    --glow: rgba(216,255,62,.25);
    --radius: 0px; --radius-sm: 0px;
    --font: 'Space Grotesk', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    --font-title: 'Space Mono', monospace;
    --mono: 'Space Mono', 'JetBrains Mono', monospace;
    --btn-primary-bg: #d8ff3e; --btn-primary-fg: #111111;
    --btn-go-bg: #f2f2f2; --btn-go-fg: #111111;
    --btn-ai-bg: transparent; --btn-ai-fg: #d8ff3e; --btn-ai-border: #d8ff3e;
    --on-accent: #111111;
    --bg-image: none;
    --panel-shadow: none;
    --wave-bg: #141414;
    --wave-line: #f2f2f2;
    --wave-playhead: #d8ff3e;
    --wave-bound: rgba(242,242,242,.75);
    --wave-bar: rgba(242,242,242,.10);
    --wave-downbeat: rgba(242,242,242,.22);
    --wave-phrase: rgba(216,255,62,.4);
    --wave-barnum: #d8ff3e;
    --tip-bg: #1f1f1f;
  }
  /* ============ THEME: tavern — D&D fantasy ============ */
  [data-theme="tavern"] {
    --bg: #191009; --panel: #241a10; --panel2: #2f2213;
    --text: #ecdcbc; --muted: #a08a64;
    --accent: #d9a441; --accent2: #8fb35c; --danger: #cf6242;
    --border: #4b3720; --border-soft: #3a2a17;
    --glow: rgba(217,164,65,.3);
    --radius: 6px; --radius-sm: 4px;
    --font: 'Alegreya', 'PingFang SC', Georgia, serif;
    --font-title: 'IM Fell English', serif;
    --mono: 'JetBrains Mono', monospace;
    --btn-primary-bg: linear-gradient(180deg, #8a6420, #6b4c15);
    --btn-primary-fg: #f4e8cc;
    --btn-go-bg: linear-gradient(180deg, #5d7a3a, #45602a); --btn-go-fg: #eef4dd;
    --btn-ai-bg: linear-gradient(180deg, #6b4a8a, #503668);
    --btn-ai-fg: #efe3fb; --btn-ai-border: #8f6cb0;
    --on-accent: #241a10;
    --bg-image:
      radial-gradient(800px 500px at 15% -10%, rgba(217,164,65,.09), transparent 60%),
      radial-gradient(700px 450px at 90% -5%, rgba(207,98,66,.06), transparent 55%),
      url("data:image/svg+xml,%3Csvg width='140' height='140' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='.85' numOctaves='2'/%3E%3CfeColorMatrix values='0 0 0 0 0.10 0 0 0 0 0.065 0 0 0 0 0.04 0 0 0 0.4 0'/%3E%3C/filter%3E%3Crect width='140' height='140' filter='url(%23n)'/%3E%3C/svg%3E");
    --panel-shadow: 0 6px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(236,220,188,.05);
    --wave-bg: #150e07;
    --wave-line: #ecdcbc;
    --wave-playhead: #8fb35c;
    --wave-bound: rgba(217,164,65,.65);
    --wave-bar: rgba(236,220,188,.08);
    --wave-downbeat: rgba(236,220,188,.2);
    --wave-phrase: rgba(217,164,65,.5);
    --wave-barnum: #e8c778;
    --tip-bg: #2f2213;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font);
    background-image: var(--bg-image);
    background-attachment: fixed;
    transition: background .25s, color .25s;
  }
  #root { max-width: 1180px; margin: 0 auto; padding: 28px 22px 60px; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px;
           border-bottom: 1px solid var(--border); padding-bottom: 16px; }
  .logo { display: flex; align-items: baseline; gap: 14px; }
  .logo .drawer-btn { align-self: center; }
  h1 {
    font-size: 24px; margin: 0; letter-spacing: 1px; font-weight: 700;
    font-family: var(--font-title); color: var(--text);
  }
  h1::after { content: '_'; color: var(--accent); animation: blink 1.2s steps(1) infinite; }
  [data-theme="tavern"] h1 { color: var(--accent); text-shadow: 0 2px 12px var(--glow); font-size: 27px; }
  [data-theme="tavern"] h1::before { content: '⚔ '; }
  [data-theme="tavern"] h1::after { content: ''; animation: none; }
  @keyframes blink { 50% { opacity: 0; } }
  .sub { color: var(--muted); font-size: 13px; font-family: var(--mono); }
  [data-theme="tavern"] .sub { font-family: var(--font); font-style: italic; font-size: 13.5px; }
  .lang-switch {
    display: flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden;
    background: transparent;
  }
  .lang-switch button {
    border: none; border-radius: 0; background: transparent; padding: 7px 13px;
    font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .5px;
    box-shadow: none;
  }
  .lang-switch button.on { background: var(--accent); color: var(--on-accent); }
  .lang-switch button:hover:not(.on) { color: var(--text); border-color: transparent; box-shadow: none; }

  /* ---------- panels ---------- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; margin-bottom: 16px;
    box-shadow: var(--panel-shadow);
    position: relative;
  }
  [data-theme="tavern"] .panel::before {
    content: ''; position: absolute; inset: 5px; pointer-events: none;
    border: 1px solid rgba(217,164,65,.15); border-radius: 3px;
  }
  .panel-title {
    font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 12px; font-family: var(--font-title);
  }
  .panel-title::before { content: '── '; }
  [data-theme="tavern"] .panel-title {
    font-size: 15px; color: var(--accent); text-transform: none; letter-spacing: 1.5px;
  }
  [data-theme="tavern"] .panel-title::before { content: ''; }
  [data-theme="tavern"] .panel-title::after { content: ' ❧'; color: var(--muted); }

  /* ---------- dropzone ---------- */
  .dropzone {
    position: relative;
    border: 1px dashed var(--border); border-radius: var(--radius);
    padding: 34px 20px; text-align: center; color: var(--muted);
    cursor: pointer; transition: border-color .2s, background .2s;
    font-size: 13.5px; font-family: var(--mono);
  }
  [data-theme="tavern"] .dropzone { font-family: var(--font); font-style: italic; font-size: 15px; border-width: 2px; }
  .dropzone:hover, .dropzone.over { border-color: var(--accent); color: var(--text); }
  .dropzone .dz-icon { font-size: 24px; display: block; margin-bottom: 8px; opacity: .8; }
  .dz-compact {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border: 1px dashed var(--border); border-radius: var(--radius);
    padding: 10px 14px; color: var(--text); font-size: 13.5px; cursor: pointer;
    transition: border-color .2s;
  }
  .dz-compact:hover, .dz-compact.over { border-color: var(--accent); }
  .dz-compact-hint { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  .dropzone b { color: var(--text); }

  /* ---------- buttons & inputs ---------- */
  button {
    background: transparent; color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 9px 16px; font-size: 13.5px; cursor: pointer;
    font-family: var(--font); font-weight: 600;
    transition: border-color .12s, background .12s, color .12s;
  }
  [data-theme="tavern"] button { background: var(--panel2); font-size: 14.5px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .35; cursor: default; }
  button.primary {
    background: var(--btn-primary-bg); border-color: transparent; color: var(--btn-primary-fg);
    font-weight: 700;
  }
  [data-theme="tavern"] button.primary { border-color: #a87e2e; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  button.go {
    background: var(--btn-go-bg); border-color: transparent;
    color: var(--btn-go-fg); font-weight: 700;
  }
  [data-theme="tavern"] button.go { border-color: #8fb35c; }
  button.go.armed { animation: pulse 1.1s infinite; }
  button.ghost { background: transparent; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px var(--glow); } }

  input[type=number], input[type=text] {
    background: transparent; color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; font-family: var(--mono);
  }
  input[type=number] { width: 68px; }
  input[type=number]:focus, input[type=text]:focus { outline: none; border-color: var(--accent); }
  label.chk {
    display: inline-flex; gap: 7px; align-items: center; font-size: 13px;
    color: var(--muted); cursor: pointer; font-weight: 600;
  }
  label.chk input { accent-color: var(--accent); width: 15px; height: 15px; }
  input[type=range] { accent-color: var(--accent); }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }

  /* ---------- waveform ---------- */
  .canvas-wrap { position: relative; user-select: none; }
  canvas { display: block; width: 100%; border-radius: var(--radius-sm); border: 1px solid var(--border); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; line-height: 1.5; }
  kbd {
    background: var(--panel2); border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 6px; font-family: var(--mono);
    font-size: 11px; color: var(--text);
  }

  /* ---------- segment chips ---------- */
  .seg-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .seg-chip {
    position: relative;
    display: flex; align-items: center; gap: 7px;
    background: var(--panel2); border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm); padding: 6px 10px; font-size: 13px; cursor: pointer;
    transition: border-color .15s;
  }
  .seg-chip:hover { border-color: var(--border); }
  .seg-chip.active { border-color: var(--accent2); box-shadow: 0 0 0 1px var(--accent2); }
  .seg-chip.queued { border-color: var(--accent); border-style: dashed; animation: pulse 1.1s infinite; }
  .seg-chip .dot { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  [data-theme="tavern"] .seg-chip .dot { transform: rotate(45deg); border-radius: 1px; }
  .seg-chip input {
    background: transparent; border: none; color: var(--text);
    font-size: 13px; width: 88px; outline: none; font-family: var(--font); font-weight: 600;
    padding: 0;
  }
  .seg-chip .time { color: var(--muted); font-size: 11px; font-family: var(--mono); }
  .seg-chip .x { color: var(--muted); cursor: pointer; padding: 0 2px; }
  .seg-chip .x:hover { color: var(--danger); }

  /* ---------- badges / status ---------- */
  .badge {
    background: transparent; border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm); padding: 4px 10px; font-size: 12px; color: var(--muted); font-weight: 600;
  }
  .badge b { color: var(--text); font-family: var(--mono); font-weight: 600; }
  .status { display: inline-flex; align-items: center; gap: 9px; font-size: 13px; color: var(--muted); }
  .spinner {
    width: 16px; height: 16px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite; flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box {
    margin-top: 12px; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px;
    border: 1px solid var(--danger); color: var(--danger);
  }

  /* ---------- now playing ---------- */
  .now {
    display: flex; align-items: center; gap: 10px;
    font-size: 13.5px; padding: 9px 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--border-soft); font-family: var(--mono);
  }
  [data-theme="tavern"] .now { font-family: var(--font); }
  .now b { color: var(--accent2); font-weight: 600; }
  .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
  .eq i {
    width: 3px; background: var(--accent2);
    animation: eq 1s ease-in-out infinite;
  }
  .eq i:nth-child(1) { height: 60%; animation-delay: 0s; }
  .eq i:nth-child(2) { height: 100%; animation-delay: .25s; }
  .eq i:nth-child(3) { height: 40%; animation-delay: .5s; }
  @keyframes eq { 0%,100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }

  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 30px; opacity: .7; }
  footer a { color: var(--accent); text-decoration: none; }

  /* ---------- AI processing ---------- */
  button.ai-btn {
    background: var(--btn-ai-bg); border: 1px solid var(--btn-ai-border);
    color: var(--btn-ai-fg); font-weight: 700;
  }
  button.ai-btn:hover:not(:disabled) { box-shadow: 0 0 12px var(--glow); }
  .ai-overlay {
    position: absolute; inset: 0; border-radius: var(--radius-sm); overflow: hidden;
    background: rgba(0,0,0,.6);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; z-index: 5;
  }
  .ai-overlay .scanline {
    position: absolute; top: 0; bottom: 0; width: 140px;
    background: linear-gradient(90deg, transparent, var(--glow), transparent);
    animation: scan 2.2s ease-in-out infinite;
  }
  @keyframes scan {
    0% { left: -140px; } 50% { left: calc(100% + 0px); } 100% { left: -140px; }
  }
  .ai-overlay .ai-title {
    font-size: 15px; font-weight: 700; letter-spacing: .5px; color: var(--accent);
    font-family: var(--font-title);
  }
  .ai-overlay .ai-stage { font-size: 12.5px; color: var(--muted); font-family: var(--mono); }
  .ai-bars { display: flex; gap: 4px; align-items: flex-end; height: 26px; }
  .ai-bars i {
    width: 5px; background: var(--accent);
    animation: aeq 1s ease-in-out infinite;
  }
  .ai-bars i:nth-child(1) { height: 40%; animation-delay: 0s; }
  .ai-bars i:nth-child(2) { height: 75%; animation-delay: .12s; }
  .ai-bars i:nth-child(3) { height: 100%; animation-delay: .24s; }
  .ai-bars i:nth-child(4) { height: 65%; animation-delay: .36s; }
  .ai-bars i:nth-child(5) { height: 85%; animation-delay: .48s; }
  .ai-bars i:nth-child(6) { height: 50%; animation-delay: .6s; }
  .ai-bars i:nth-child(7) { height: 70%; animation-delay: .72s; }
  @keyframes aeq { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }

  /* ---------- volume control ---------- */
  .volume-box {
    position: fixed; right: 18px; bottom: 18px; z-index: 50;
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 9px 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  .volume-box .vol-icon { font-size: 15px; cursor: pointer; user-select: none; width: 20px; text-align: center; }
  .volume-box input[type=range] { width: 110px; }
  .volume-box .vol-num {
    font-family: var(--mono); font-size: 11px;
    color: var(--muted); width: 34px; text-align: right;
  }

  /* ---------- dropdown ---------- */
  .dropdown { position: relative; }
  .dropdown-menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 30;
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 5px; min-width: 190px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  .dropdown-item {
    padding: 8px 12px; border-radius: var(--radius-sm); font-size: 13.5px;
    cursor: pointer; white-space: nowrap;
  }
  .dropdown-item:hover { background: var(--panel); color: var(--accent); }

  /* ---------- custom tooltips ---------- */
  .tip { position: relative; cursor: help; }
  .tip::after {
    content: attr(data-tip);
    position: absolute; left: 50%; bottom: calc(100% + 8px);
    transform: translateX(-50%) translateY(4px);
    background: var(--tip-bg); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 9px 12px; font-size: 12.5px; font-weight: 400; line-height: 1.45;
    width: max-content; max-width: 300px; white-space: normal;
    opacity: 0; pointer-events: none; z-index: 60;
    transition: opacity .15s, transform .15s;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
    font-family: var(--font);
  }
  .tip:hover::after { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- stem layers ---------- */
  .layer-grid { display: flex; flex-direction: column; gap: 4px; }
  .layer-row {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm); padding: 5px 12px;
  }
  .layer-row.off { opacity: .45; }
  .layer-name { font-weight: 700; font-size: 13px; width: 86px; }
  [data-theme="tavern"] .layer-name { font-family: var(--font-title); font-weight: 400; font-size: 14.5px; }

  /* ---------- collapsible sections ---------- */
  .collapse-head {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    user-select: none; padding: 4px 0;
  }
  .collapse-head:hover .panel-title { color: var(--text); }
  .collapse-head .caret {
    font-size: 10px; color: var(--muted); transition: transform .15s;
  }
  .collapse-head .caret.open { transform: rotate(90deg); }
  .collapse-head .count {
    font-size: 11px; color: var(--muted);
    font-family: var(--mono);
  }

  /* ---------- theme switch ---------- */
  .theme-switch {
    display: flex; border: 1px solid var(--border); border-radius: var(--radius-sm);
    overflow: hidden; margin-right: 10px;
  }
  .theme-switch button {
    border: none; border-radius: 0; background: transparent; padding: 7px 12px;
    font-size: 14px; color: var(--muted);
  }
  .theme-switch button.on { background: var(--accent); color: var(--on-accent); }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--accent); border-radius: var(--radius-sm);
    padding: 12px 18px; font-size: 13.5px; z-index: 70;
    max-width: 640px; box-shadow: 0 10px 40px rgba(0,0,0,.6);
    animation: toast-in .25s ease-out;
  }
  @keyframes toast-in {
    from { opacity: 0; transform: translateX(-50%) translateY(12px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* ---------- projects (set lists) ---------- */
  .proj-name {
    background: transparent; border: none; border-bottom: 1px dashed var(--border); color: var(--text);
    font-family: var(--font-title); font-weight: 700; font-size: 15px; padding: 2px 4px; outline: none; min-width: 180px;
  }
  .proj-name:focus { border-bottom-color: var(--accent); }
  .proj-select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 8px 10px; font-family: inherit; font-size: 13px; max-width: 260px;
  }
  .proj-select.small, button.small { padding: 4px 8px; font-size: 12px; }
  .proj-groups { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .proj-group { border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 8px 10px; }
  .proj-group-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .proj-group-head .x { color: var(--muted); cursor: pointer; }
  .proj-group-head .x:hover { color: var(--accent); }
  .proj-group-name {
    background: transparent; border: none; color: var(--accent); outline: none;
    font-family: var(--font-title); font-weight: 700; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; width: 200px;
  }
  .proj-item {
    display: flex; align-items: center; gap: 8px; margin-top: 6px; padding: 6px 8px;
    background: var(--panel2); border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
    cursor: pointer; font-size: 13px;
  }
  .proj-item:hover { border-color: var(--border); }
  .proj-item.active { border-color: var(--accent2); box-shadow: 0 0 0 1px var(--accent2); }
  .proj-item.missing { opacity: .55; cursor: default; }
  .proj-item-icon { color: var(--accent); width: 16px; text-align: center; }
  .proj-item-name { font-weight: 600; flex: 1; min-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj-item-name .time { color: var(--muted); font-family: var(--mono); font-size: 11px; font-weight: 400; }
  .proj-note {
    background: transparent; border: none; border-bottom: 1px dashed transparent; color: var(--muted);
    font-size: 12px; font-family: var(--font); outline: none; width: 220px; padding: 2px 0;
  }

// current theme colors from CSS variables (for canvas)
function themeColors() {
  const cs = getComputedStyle(document.documentElement);
  const v = name => cs.getPropertyValue(name).trim();
  return {
    waveBg: v('--wave-bg') || '#141414',
    waveLine: v('--wave-line') || '#f2f2f2',
    playhead: v('--wave-playhead') || '#d8ff3e',

    if (n0 < 0) { n1 -= n0; n0 = 0; }
    if (n1 > duration) { n0 -= n1 - duration; n1 = duration; }
    viewRef.current = ns >= duration ? { t0: 0, t1: 0 } : { t0: Math.max(0, n0), t1: n1 };
  };

  const onMouseDown = e => {
    if (!duration) return;
    const tt = timeAt(e);
    const tolT = tolTime();
    // 0) scrollbar (bottom 12px when zoomed)
    {
      const rect = canvasRef.current.getBoundingClientRect();
      const my = e.clientY - rect.top;
      const { t0, t1 } = view();
      const span = t1 - t0;
      if (span < duration * 0.999 && my > H - 14) {
        const W = rect.width;
        const bx = (t0 / duration) * W;
        const bw = Math.max(24, (span / duration) * W);
        const mx = e.clientX - rect.left;
        if (mx >= bx && mx <= bx + bw) {
          // drag the thumb
          dragRef.current = { type: 'scroll', grabDx: mx - bx, span };
        } else {
          // click on the track — jump the window and start dragging right away
          let n0 = (mx / W) * duration - span / 2;
          n0 = Math.max(0, Math.min(duration - span, n0));
          viewRef.current = { t0: n0, t1: n0 + span };
          dragRef.current = { type: 'scroll', grabDx: bw / 2, span };
        }
        e.preventDefault();
        return;
      }
    }
    // 1) playhead — priority
    const pos = (player && player.position()) ?? (player && player.pendingPos);
    if (pos != null && Math.abs(pos - tt) < tolT) {
      dragRef.current = { type: 'playhead', pos };
      e.preventDefault();
      return;
    }
    // 2) loopStart marker
    for (let i = 0; i < segments.length; i++) {
      const s = segments[i];
      if (s.loop !== false && s.loopStart != null
          && Math.abs(s.loopStart - tt) < tolT) {
        dragRef.current = { type: 'loopstart', idx: i };
        if (beginEdit) beginEdit();
        e.preventDefault();
        return;
      }
    }
    // 3) segment boundaries
    for (let i = 1; i < segments.length; i++) {
      if (Math.abs(segments[i].start - tt) < tolT) {
        dragRef.current = { type: 'bound', idx: i };
        if (beginEdit) beginEdit();
        e.preventDefault();
        return;
      }
    }
    // 4) Alt+click inside a part — set loopStart at that point
    if (e.altKey) {
      const i = segments.findIndex(s => tt > s.start + 0.3 && tt < s.end - 0.3);
      if (i >= 0) {
        const nt = snapTime(tt);
        setSegments(segs => {
          const ns = segs.map(s => ({ ...s }));
          ns[i].loopStart = Math.max(ns[i].start + 0.3, Math.min(ns[i].end - 0.5, nt));
          return ns;
        });
        return;
      }
    }
    // 5) click on empty space — seek to that point
    player.seek(tt);
  };
  const onMouseMove = e => {
    const canvas = canvasRef.current;
    if (!canvas || !duration) return;
    const tt = timeAt(e);
    const d = dragRef.current;
    if (d && d.type === 'scroll') {
      const rect = canvas.getBoundingClientRect();
      const W = rect.width;
      const mx = e.clientX - rect.left;
      const span = d.span;
      let n0 = ((mx - d.grabDx) / W) * duration;
      n0 = Math.max(0, Math.min(duration - span, n0));
      viewRef.current = { t0: n0, t1: n0 + span };
      return;
    }
    if (d && d.type === 'playhead') {
      d.pos = Math.max(0, Math.min(duration - 0.05, tt));
      return;
    }
    if (d && d.type === 'loopstart') {
      const i = d.idx;
      const s = segments[i];
      const nt = Math.max(s.start + 0.3, Math.min(s.end - 0.5, snapTime(tt)));
      setSegments(segs => {
        const ns = segs.map(x => ({ ...x }));
        ns[i].loopStart = nt;
        return ns;
      }, true);
      return;
    }
    if (d && d.type === 'bound') {
      const i = d.idx;
      const lo = segments[i - 1].start + 0.5;
      const hi = segments[i].end - 0.5;
      const nt = Math.max(lo, Math.min(hi, snapTime(tt)));
      setSegments(segs => {
        const ns = segs.map(s => ({ ...s }));
        ns[i - 1].end = nt; ns[i].start = nt;
        return ns;
      }, true);
      return;
    }
    const tolT = tolTime();
    const rect2 = canvas.getBoundingClientRect();
    const my2 = e.clientY - rect2.top;
    const v2 = view();
    const onScrollbar = (v2.t1 - v2.t0) < duration * 0.999 && my2 > H - 14;
    const pos = (player && player.position()) ?? (player && player.pendingPos);
    const onPlayhead = pos != null && Math.abs(pos - tt) < tolT;
    const onLoopStart = segments.some(s => s.loop !== false && s.loopStart != null
                                      && Math.abs(s.loopStart - tt) < tolT);
    const nearBound = segments.some((s, i) => i > 0 && Math.abs(s.start - tt) < tolT);
    canvas.style.cursor = onScrollbar ? 'grab' : onPlayhead ? 'grab'
      : (onLoopStart || nearBound) ? 'ew-resize' : 'pointer';
  };
  const onMouseUp = () => {
    const d = dragRef.current;
    dragRef.current = null;
    if (d && d.type === 'playhead') player.seek(d.pos);
    if (d && (d.type === 'bound' || d.type === 'loopstart') && commitEdit) commitEdit();
  };
  const onDblClick = e => {
    const tt = snapTime(timeAt(e));
    setSegments(segs => {
      const i = segs.findIndex(s => tt > s.start + 0.5 && tt < s.end - 0.5);
      if (i < 0) return segs;
      const ns = segs.map(s => ({ ...s }));
      const right = { start: tt, end: ns[i].end, label: ns[i].label + '·2' };
      ns[i] = { ...ns[i], end: tt };
      ns.splice(i + 1, 0, right);
      return ns;
    });
  };

  useEffect(() => {
    window.addEventListener('mouseup', onMouseUp);
    const cv = canvasRef.current;
    if (cv) cv.addEventListener('wheel', onWheel, { passive: false });
    return () => {
      window.removeEventListener('mouseup', onMouseUp);
      if (cv) cv.removeEventListener('wheel', onWheel);
    };
  }, [duration, segments]);

  return (
    <div className="canvas-wrap">
      <canvas ref={canvasRef} style={{ height: H }}
        onMouseDown={onMouseDown} onMouseMove={onMouseMove} onDoubleClick={onDblClick} />
      {aiWorking && <AiOverlay t={t} />}
      <div className="hint">{t.wave_hint}</div>
    </div>
  );
}

// AI-processing overlay: scanning stripe + rotating stages
function AiOverlay({ t }) {
  const stages = [t.ai_stage1, t.ai_stage2, t.ai_stage3, t.ai_stage4];
  const [idx, setIdx] = useState(0);
  useEffect(() => {
    // approximate stage durations (sec) on the first run
    const timers = [
      setTimeout(() => setIdx(1), 8000),
      setTimeout(() => setIdx(2), 45000),
      setTimeout(() => setIdx(3), 70000),
    ];
    return () => timers.forEach(clearTimeout);
  }, []);
  return (
    <div className="ai-overlay">
      <div className="scanline"></div>
      <div className="ai-bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div className="ai-title">✨ {t.ai_working}</div>
      <div className="ai-stage">{stages[idx]}</div>
    </div>
  );
}

// ================================ App ======================================
function App() {
  const [lang, setLang] = useState(() => {
    const saved = localStorage.getItem('musslop_lang');
    return STR[saved] ? saved : 'en';
  });
  const t = STR[lang];
  const setLanguage = l => { setLang(l); localStorage.setItem('musslop_lang', l); document.documentElement.lang = l; };

  // --- UI theme --------------------------------------------------------------
  const [theme, setThemeState] = useState(() => {
    const t0 = localStorage.getItem('musslop_theme');
    return (t0 === 'tavern' || t0 === 'mono') ? t0 : 'mono';
  });
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('musslop_theme', theme);
  }, [theme]);

  const [trackId, setTrackId] = useState(null);
  const [trackName, setTrackName] = useState('');
  const [loading, setLoading] = useState(null);
  const [error, setError] = useState(null);
  const [analysis, setAnalysis] = useState(null);
  const [segments, setSegmentsRaw] = useState([]);

  // --- Undo (Ctrl+Z): segment change history -------------------------
  const historyRef = useRef([]);       // stack of past states
  const dragSnapRef = useRef(null);    // snapshot before a drag series starts
  // regular change: snapshot into history; silent=true — no record (drag)
  const setSegments = useCallback((updater, silent = false) => {
    setSegmentsRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      if (!silent && next !== prev) {
        historyRef.current.push(prev);
        if (historyRef.current.length > 100) historyRef.current.shift();
      }
      return next;
    });
  }, []);
  // drag series: one undo step for the entire drag
  const beginEdit = useCallback(() => {
    setSegmentsRaw(prev => { dragSnapRef.current = prev; return prev; });
  }, []);
  const commitEdit = useCallback(() => {
    const snap0 = dragSnapRef.current;
    dragSnapRef.current = null;
    if (snap0 == null) return;
    setSegmentsRaw(prev => {
      if (prev !== snap0) {
        historyRef.current.push(snap0);
        if (historyRef.current.length > 100) historyRef.current.shift();
      }
      return prev;
    });
  }, []);
  const undo = useCallback(() => {
    const prev = historyRef.current.pop();
    if (prev) setSegmentsRaw(prev);
  }, []);
  const [buffer, setBuffer] = useState(null);
  const [snap, setSnap] = useState(true);
  const [nSeg, setNSeg] = useState('');
  const [aiWorking, setAiWorking] = useState(false);   // AI analysis in progress
  const [exportOpen, setExportOpen] = useState(false);
  const [meterOpen, setMeterOpen] = useState(false);
  // close the meter menu on an outside click / Esc
  useEffect(() => {
    if (!meterOpen) return;
    const close = e => {
      if (e.type === 'keydown' ? e.code === 'Escape' : !e.target.closest('.meter-menu, .meter-badge')) setMeterOpen(false);
    };
    document.addEventListener('mousedown', close);
    document.addEventListener('keydown', close);
    return () => { document.removeEventListener('mousedown', close); document.removeEventListener('keydown', close); };
  }, [meterOpen]);
  const [openGroups, setOpenGroups] = useState({ lib: true, hist: false });
  const [stingerMenu, setStingerMenu] = useState(null); // index of the part with the stinger menu open
  const [tailOn, setTailOn] = useState(true);
  const [bassSwapOn, setBassSwapOn] = useState(true);
  const [volume, setVolumeState] = useState(() => {
    const v = parseFloat(localStorage.getItem('musslop_volume'));
    // don't restore a saved mute (0): after a page reload a
    // "silent" player looks like broken audio
    return isFinite(v) && v > 0.02 ? v : 1;
  });
  const setVolume = v => {
    setVolumeState(v);
    localStorage.setItem('musslop_volume', String(v));
    if (playerRef.current) playerRef.current.setVolume(v);
  };
  const [deepAvailable, setDeepAvailable] = useState(false);
  const [songformerAvailable, setSongformerAvailable] = useState(false);
  useEffect(() => {
    fetch('/api/health').then(r => r.json())
      .then(h => {
        setDeepAvailable(!!h.deep_available);
        setSongformerAvailable(!!h.songformer_available);
      }).catch(() => {});
  }, []);
  const [dragOver, setDragOver] = useState(false);
  const [pendingMarkupFile, setPendingMarkupFile] = useState(null);
  const [rate, setRateState] = useState(1);
  const [crossfade, setCrossfade] = useState(0);       // sec
  const [reverbAmt, setReverbAmt] = useState(0);       // 0..1 wet
  const [phraseBars, setPhraseBars] = useState(4);     // 4 or 8 bars
  // when a transition lands (Next, part click, hotkeys, scenes):
  // natural (loop end) | soon (phrase boundary) | now (short crossfade)
  const [cueMode, setCueMode] = useState('natural');
  // --- Scenes: saved playback states of this track (part + layers + fx) ----
  const [scenes, setScenesRaw] = useState([]);
  const [liveMode, setLiveMode] = useState(false);
  const [sceneMenu, setSceneMenu] = useState(null);     // scene id with the menu open
  const [, force] = useState(0);
  const playerRef = useRef(null);
  const fileRef = useRef(null);
  const markupRef = useRef(null);
  const loopQT = useRef(null);

  if (!playerRef.current) {
    playerRef.current = new LoopPlayer();
    playerRef.current.volume = volume;
  }
  const player = playerRef.current;
  useEffect(() => { player.onState = () => force(x => x + 1); }, []);
  // stingers: download right away (bytes), decode lazily — on first
  // playback. Do NOT create an AudioContext without a user gesture:
  // an auto-created suspended context breaks audio in some browsers.
  const stingerRaw = useRef({});
  useEffect(() => {
    (async () => {
      for (const name of ['cymbal', 'boom', 'riser']) {
        try {
          stingerRaw.current[name] = await (await fetch(`stingers/${name}.wav`)).arrayBuffer();
        } catch (e) {}
      }
    })();
  }, []);
  useEffect(() => {
    player.loadStingers = async () => {
      if (!player.ctx) return;
      for (const [name, ab] of Object.entries(stingerRaw.current)) {
        if (!player.stingerBuffers[name] && ab) {
          try { player.stingerBuffers[name] = await player.decode(ab.slice(0)); }
          catch (e) {}
        }
      }
    };
  }, []);
  // track change -> old track's stems are stale; speed back to the original
  useEffect(() => {
    player.stems = null;
    setStemsState('none');
    setRateState(1);
    player.setRate(1);
  }, [trackId]);
  useEffect(() => { player.setSegments(segments); }, [segments]);
  useEffect(() => { player.crossfade = crossfade; }, [crossfade]);
  useEffect(() => { player.setReverb(reverbAmt); }, [reverbAmt]);
  useEffect(() => { player.transitionMode = cueMode; }, [cueMode]);
  useEffect(() => { player.phraseBars = phraseBars; }, [phraseBars]);
  useEffect(() => {
    if (analysis) player.downbeats = analysis.downbeats || [];
  }, [analysis]);
  useEffect(() => () => player.stop(false), []);
  // while a transition is pending, refresh the ETA label once a second
  useEffect(() => {
    if (!player.playing) return;
    const id = setInterval(() => { if (player.transitionEta() != null || liveMode) force(x => x + 1); }, 500);
    return () => clearInterval(id);
  }, [player.playing, liveMode]);

  // recompute loop quality after manual editing (debounce 800ms)
  useEffect(() => {
    if (!trackId || !segments.length) return;
    clearTimeout(loopQT.current);
    loopQT.current = setTimeout(async () => {
      try {
        const r = await fetch(`/api/loopability/${trackId}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(segments.map(s => ({ start: s.start, end: s.end }))),
        });
        if (!r.ok) return;
        const { loopability } = await r.json();
        setSegments(segs => segs.length === loopability.length
          ? segs.map((s, i) => ({ ...s, loopability: loopability[i] })) : segs);
      } catch (e) {}
    }, 800);
    return () => clearTimeout(loopQT.current);
  }, [trackId, segments.map(s => `${s.start.toFixed(2)}_${s.end.toFixed(2)}`).join('|')]);

  // --- Stems (vertical layering) -------------------------------------------
  const [stemsState, setStemsState] = useState('none'); // none|loading|ready
  const defaultLayers = () => ({
    drums: { on: true, vol: 1 }, bass: { on: true, vol: 1 },
    other: { on: true, vol: 1 }, vocals: { on: true, vol: 1 },
  });
  const [layers, setLayersState] = useState(defaultLayers);
  const updateLayer = (name, patch) => {
    setLayersState(prev => {
      const next = { ...prev, [name]: { ...prev[name], ...patch } };
      player.setLayers(next);
      return next;
    });
  };
  const loadStems = async () => {
    if (!trackId || stemsState === 'loading') return;
    setError(null);
    setStemsState('loading');
    setLoading(t.stems_loading);
    try {
      const r = await fetch(`/api/stems/${trackId}`, { method: 'POST' });
      if (!r.ok) throw new Error((await r.json()).detail || t.err_analyze);
      // poll the background task with percentages
      while (true) {
        const st = await (await fetch(`/api/stems/${trackId}/status`)).json();
        if (st.status === 'done') break;
        if (st.status === 'error') throw new Error(st.error || t.err_analyze);
        if (st.status === 'none') throw new Error(t.err_analyze);
        setLoading(`${t.stems_loading_pct} ${st.progress || 0}%`);
        await new Promise(res => setTimeout(res, 1500));
      }
      player._ensureCtx();
      const names = ['drums', 'bass', 'other', 'vocals'];
      const bufs = {};
      for (let i = 0; i < names.length; i++) {
        setLoading(`${t.stems_downloading} ${i + 1}/4…`);
        const ab = await (await fetch(`/api/stems/${trackId}/${names[i]}`)).arrayBuffer();
        bufs[names[i]] = await player.decode(ab);
      }
      player.stems = bufs;
      player.layers = layers; // chunks pick up per-layer gains at schedule time
      setStemsState('ready');
      // restart playback on the stems from the current position
      if (player.playing) {
        const pos = player.position();
        if (pos != null) player._softRestartAt(pos);
      }
    } catch (e) {
      setError(String(e.message || e));
      setStemsState('none');
    } finally {
      setLoading(null);
    }
  };
  const unloadStems = () => {
    player.stems = null;
    setStemsState('none');
    if (player.playing) {
      const pos = player.position();
      if (pos != null) player._softRestartAt(pos);
    }
  };

  // --- Import from URL --------------------------------------------------------
  const [importUrl, setImportUrl] = useState('');
  const importFromUrl = async () => {
    const url = importUrl.trim();
    if (!url) return;
    setError(null);
    setLoading(t.url_downloading);
    try {
      const r = await fetch('/api/import_url', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url }),
      });
      if (!r.ok) throw new Error((await r.json()).detail || t.err_upload);
      const { track_id, name } = await r.json();
      setImportUrl('');
      loadHistory();
      await openFromHistory({ track_id, name });
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setLoading(null);
    }
  };

  const exportLoops = async (target = 'generic') => {
    if (!trackId) return;
    setError(null);
    setLoading(t.exporting);
    try {
      const r = await fetch(`/api/export/${trackId}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          segments: segments.map(s => ({ start: s.start, end: s.end, label: s.label,
                                         loop: s.loop, loopStart: s.loopStart, stinger: s.stinger })),
          scenes,
          tempo: analysis && analysis.tempo,
          downbeats: (analysis && analysis.downbeats) || [],
          beats_per_bar: (analysis && analysis.beats_per_bar) || 4,
          phrase_bars: phraseBars,
          tails: tailOn,
          target, crossfade,
        }),
      });
      if (!r.ok) throw new Error(t.err_export);
      // download with progress (the zip can be large — full-quality WAV)
      const total = +r.headers.get('Content-Length') || 0;
      const reader = r.body.getReader();
      const chunks = []; let got = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value); got += value.length;
        setLoading(total
          ? `${t.export_downloading} ${Math.round(got / total * 100)}% (${(got / 1048576).toFixed(0)} MB)`
          : `${t.export_downloading} ${(got / 1048576).toFixed(0)} MB`);
      }
      const blob = new Blob(chunks, { type: 'application/zip' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (trackName || 'track').replace(/\.[^.]+$/, '') + (target === 'foundry' ? '_foundry.zip' : '_loops.zip');
      a.click();
      URL.revokeObjectURL(a.href);
      if (target === 'foundry') showToast(t.export_foundry_done);
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setLoading(null);
    }
  };

  const exportMarkup = () => {
    const data = { track: trackName, tempo: analysis && analysis.tempo,
                   beats_per_bar: analysis && analysis.beats_per_bar,
                   meter_manual: !!(analysis && analysis.meter && analysis.meter.source === 'manual'),
                   meter_phase: analysis && analysis.meter ? analysis.meter.phase : undefined,
                   segments, scenes };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (trackName || 'markup').replace(/\.[^.]+$/, '') + '.musslop.json';
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const importMarkup = async file => {
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data.segments) || !data.segments.length) throw new Error('no segments');
      const segs = data.segments
        .map(s => ({ start: +s.start, end: +s.end, label: String(s.label || ''),
                     loop: s.loop !== false,
                     transition: !!s.transition,
                     loopStart: isFinite(+s.loopStart) ? +s.loopStart : undefined,
                     stinger: ['cymbal','boom','riser'].includes(s.stinger) ? s.stinger : undefined }))
        .filter(s => isFinite(s.start) && isFinite(s.end) && s.end > s.start)
        .sort((a, b) => a.start - b.start);
      if (!segs.length) throw new Error('empty markup');
      setSegments(segs);
      // a manually chosen meter travels with the markup file
      if (data.meter_manual && METERS.includes(+data.beats_per_bar))
        setMeter(+data.beats_per_bar, Number.isInteger(+data.meter_phase) ? +data.meter_phase : null);
      if (Array.isArray(data.scenes)) {
        setScenesRaw(data.scenes
          .filter(s => s && Number.isInteger(+s.segIndex) && +s.segIndex >= 0 && +s.segIndex < segs.length)
          .map(s => ({
            id: String(s.id || Math.random().toString(36).slice(2, 8)),
            name: String(s.name || ''), segIndex: +s.segIndex,
            layers: s.layers && typeof s.layers === 'object' ? s.layers : null,
            rate: isFinite(+s.rate) ? +s.rate : 1,
            crossfade: isFinite(+s.crossfade) ? +s.crossfade : 0,
            reverb: isFinite(+s.reverb) ? +s.reverb : 0,
            cueMode: ['natural', 'soon', 'now'].includes(s.cueMode) ? s.cueMode : 'natural',
            hotkey: /^[1-9]$/.test(String(s.hotkey || '')) ? String(s.hotkey) : null,
          })));
      }
      setError(null);
    } catch (e) {
      setError(t.err_markup + ' ' + e.message);
    } finally {
      if (markupRef.current) markupRef.current.value = '';
    }
  };

  const upload = async file => {
    setError(null);
    player.stop();
    try {
      // The browser already has the file — decode it directly, without downloading
      // from the server. In parallel, send it to the server for structure analysis.
      setLoading(t.loading_decode);
      const fd = new FormData();
      fd.append('file', file);
      const uploadPromise = fetch('/api/upload', { method: 'POST', body: fd });

      const ab = await file.arrayBuffer();
      player._ensureCtx();
      let buf = null;
      try {
        buf = await player.decode(ab.slice(0));
      } catch (e) { buf = null; }

      setLoading(t.loading_upload);
      const r = await uploadPromise;
      if (!r.ok) throw new Error((await r.json()).detail || t.err_upload);
      const { track_id, name } = await r.json();
      setTrackId(track_id); setTrackName(name);

      // Server-side analysis is the source of truth for the duration
      const a = await doAnalyze(track_id, null);
      loadHistory();
      if (pendingMarkupFile) {
        const f = pendingMarkupFile;
        setPendingMarkupFile(null);
        await importMarkup(f);
      }

      // compare durations: browser decoders sometimes truncate
      // FLAC/m4a with embedded cover art — then take the WAV from the server
      const serverDur = a ? a.duration : null;
      const durOk = buf && serverDur != null
        && Math.abs(buf.duration - serverDur) < Math.max(1, serverDur * 0.02);
      if (buf && (serverDur == null || durOk)) {
        player.buffer = buf;
        setBuffer(buf);
      } else {
        setLoading(t.loading_transcode);
        const wavR = await fetch(`/api/audio/${track_id}?transcode=1`);
        if (!wavR.ok) throw new Error(t.err_upload);
        const wavAb = await wavR.arrayBuffer();
        const wavBuf = await player.decode(wavAb);
        player.buffer = wavBuf;
        setBuffer(wavBuf);
      }
    } catch (e) {
      setError(String(e.message || e));
    } finally {
      setLoading(null);
    }
  };

  // --- Track history --------------------------------------------------------
  const [history, setHistory] = useState([]);
  const loadHistory = useCallback(async () => {
    try {
      const r = await fetch('/api/tracks');
      if (r.ok) setHistory((await r.json()).tracks);
    } catch (e) {}
  }, []);
  useEffect(() => { loadHistory(); }, []);

  // autosave the markup to the server (debounce 1.2s)
  const saveT = useRef(null);
  useEffect(() => {
    if (!trackId || !analysis || !segments.length) return;
    clearTimeout(saveT.current);
    saveT.current = setTimeout(() => {
      fetch(`/api/markup/${trackId}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          duration: analysis.duration, tempo: analysis.tempo,
          beats: analysis.beats, downbeats: analysis.downbeats,
          beats_per_bar: analysis.beats_per_bar, meter: analysis.meter,
          beat_accents: analysis.beat_accents, downbeats_auto: analysis.downbeats_auto,
          n_suggested: analysis.n_suggested, n_max: analysis.n_max,
          engine: analysis.engine,
          segments, scenes,
        }),
      }).then(() => loadAllScenes()).catch(() => {});
    }, 1200);
    return () => clearTimeout(saveT.current);
  }, [trackId, segments, analysis, scenes]);

  // open a track from history: audio from the server + saved markup
  // opts.beforeSwap: a promise to await before the old track is torn down
  // (Live track switch: fetch + decode run while the current track fades out)
  const openFromHistory = async (item, opts = {}) => {
    setError(null);
    if (!opts.beforeSwap) player.stop();
    let ok = false;
    try {
      setLoading(t.loading_history);
      const [audioR, markupR] = await Promise.all([
        fetch(`/api/audio/${item.track_id}`),
        fetch(`/api/markup/${item.track_id}`),
      ]);
      if (!audioR.ok) throw new Error(t.err_upload);
      const ab = await audioR.arrayBuffer();
      player._ensureCtx();
      let buf = null;
      try { buf = await player.decode(ab); } catch (e) { buf = null; }
      if (opts.beforeSwap) { await opts.beforeSwap; player.stop(); }
      setTrackId(item.track_id); setTrackName(item.name);

      const markup = markupR.ok ? (await markupR.json()).markup : null;
      let serverDur = markup ? markup.duration : null;
      let analyzed = null;
      if (markup && Array.isArray(markup.segments) && markup.segments.length) {
        historyRef.current = [];
        setAnalysis({
          duration: markup.duration, tempo: markup.tempo || 0,
          beats: markup.beats || [], downbeats: markup.downbeats || [],
          beats_per_bar: markup.beats_per_bar || 4, meter: markup.meter || null,
          beat_accents: markup.beat_accents || null, downbeats_auto: markup.downbeats_auto || null,
          n_suggested: markup.n_suggested, n_max: markup.n_max,
          segments: markup.segments, fallback: false, engine: markup.engine,
        });
        // markups saved before meter detection: detect it now for the
        // current beat grid, without touching the parts (the grid stays 4/4;
        // the badge suggests the detected meter if it differs)
        if (!markup.meter && (markup.beats || []).length >= 8) {
          fetch(`/api/meter/${item.track_id}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ beats: markup.beats, downbeats: markup.downbeats || [], engine: markup.engine }),
          }).then(r => r.ok ? r.json() : null).then(m => {
            if (!m) return;
            setAnalysis(a => a && !a.meter ? {
              ...a, beat_accents: m.beat_accents, downbeats_auto: m.downbeats_auto,
              meter: { ...m.meter, beats_per_bar: 4, phase: gridPhase(a.beats, a.downbeats, 4),
                       source: m.meter.detected === 4 ? m.meter.source : 'legacy' },
            } : a);
          }).catch(() => {});
        }
        setSegmentsRaw(markup.segments);
        setScenesRaw(Array.isArray(markup.scenes) ? markup.scenes : []);
      } else {
        setScenesRaw([]);
        analyzed = await doAnalyze(item.track_id, null);
        if (analyzed) serverDur = analyzed.duration;
      }

      // the browser may have truncated the original (FLAC with cover art etc.)
      const durOk = buf && serverDur != null
        && Math.abs(buf.duration - serverDur) < Math.max(1, serverDur * 0.02);
      if (buf && (serverDur == null || durOk)) {
        player.buffer = buf;
        setBuffer(buf);
      } else {
        setLoading(t.loading_transcode);
        const wavR = await fetch(`/api/audio/${item.track_id}?transcode=1`);
        if (!wavR.ok) throw new Error(t.err_upload);
        const wavBuf = await player.decode(await wavR.arrayBuffer());
        player.buffer = wavBuf;
        setBuffer(wavBuf);
      }
      ok = true;
    } catch (e) {
      if (opts.beforeSwap) player.stop();
      setError(String(e.message || e));
    } finally {
      setLoading(null);
    }
    return ok;
  };

  const deleteFromHistory = async (e, item) => {
    e.stopPropagation();
    try {
      await fetch(`/api/tracks/${item.track_id}`, { method: 'DELETE' });
      loadHistory();
    } catch (er) {}
  };

  const toggleFavorite = async (e, item) => {
    if (e) e.stopPropagation();
    try {
      await fetch(`/api/favorite/${item.track_id}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ favorite: !item.favorite }),
      });
      loadHistory();
    } catch (er) {}
  };
  const currentFav = history.find(h => h.track_id === trackId);

  // --- Projects (set lists) ---------------------------------------------------
  // A project = groups of items; an item points at a track (and optionally a
  // scene of that track). Prepare a whole session in advance, then open
  // tracks / scenes from the list during play.
  const [projects, setProjects] = useState([]);          // summaries
  const [project, setProject] = useState(null);          // the open project (full)
  // --- side drawer ------------------------------------------------------------
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [drawerTab, setDrawerTab] = useState(() => localStorage.getItem('musslop_drawer_tab') || 'library');
  useEffect(() => { localStorage.setItem('musslop_drawer_tab', drawerTab); }, [drawerTab]);
  // --- music folders -----------------------------------------------------------
  const [folders, setFolders] = useState([]);
  const [folderInput, setFolderInput] = useState('');
  const [folderError, setFolderError] = useState(null);
  const [folderFiles, setFolderFiles] = useState({});     // path -> files[] | undefined (scanning)
  const [openFolders, setOpenFolders] = useState({});
  const loadFolders = useCallback(async () => {
    try { const r = await fetch('/api/folders'); if (r.ok) setFolders((await r.json()).folders); } catch (e) {}
  }, []);
  useEffect(() => { loadFolders(); }, []);
  const scanFolder = async path => {
    setFolderFiles(ff => ({ ...ff, [path]: undefined }));
    try {
      const r = await fetch(`/api/folders/scan?path=${encodeURIComponent(path)}`);
      const files = r.ok ? (await r.json()).files : [];
      setFolderFiles(ff => ({ ...ff, [path]: files }));
    } catch (e) { setFolderFiles(ff => ({ ...ff, [path]: [] })); }
  };
  const toggleFolder = path => {
    const open = !openFolders[path];
    setOpenFolders(o => ({ ...o, [path]: open }));
    if (open && folderFiles[path] === undefined) scanFolder(path);
  };
  const addFolder = () => addFolderPath(folderInput.trim());
  const addFolderPath = async path => {
    if (!path) return;
    setFolderError(null);
    try {
      const r = await fetch('/api/folders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path }) });
      if (!r.ok) throw new Error((await r.json()).detail || t.folders_err);
      const { path: real } = await r.json();
      setFolderInput('');
      await loadFolders();
      setOpenFolders(o => ({ ...o, [real]: true }));
      scanFolder(real);
    } catch (e) { setFolderError(String(e.message || e)); }
  };
  const removeFolder = async path => {
    await fetch(`/api/folders?path=${encodeURIComponent(path)}`, { method: 'DELETE' });
    loadFolders();
  };
  // click on a file: import (once) then open like a history item
  const openFolderFile = async (root, file) => {
    setError(null);
    try {
      setLoading(t.folders_importing);
      const r = await fetch('/api/folders/import', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: file.path }) });
      if (!r.ok) throw new Error((await r.json()).detail || t.err_upload);
      const { track_id, name } = await r.json();
      loadHistory();
      setFolderFiles(ff => ({ ...ff, [root]: (ff[root] || []).map(x => x.path === file.path ? { ...x, track_id } : x) }));
      await openFromHistory({ track_id, name });
    } catch (e) { setError(String(e.message || e)); setLoading(null); }
  };
  // quick listen straight from the folder (no import): one shared <audio>
  const previewRef = useRef(null);
  const [previewPath, setPreviewPath] = useState(null);
  const [previewPos, setPreviewPos] = useState(0);
  const stopFilePreview = () => {
    const a = previewRef.current; if (a) { a.pause(); a.removeAttribute('src'); a.load(); }
    setPreviewPath(null); setPreviewPos(0);
  };
  const toggleFilePreview = file => {
    if (previewPath === file.path) { stopFilePreview(); return; }
    if (!previewRef.current) {
      const a = new Audio(); a.preload = 'auto';
      a.addEventListener('timeupdate', () => setPreviewPos(a.currentTime));
      a.addEventListener('ended', () => stopFilePreview());
      previewRef.current = a;
    }
    player.stop(); player.stopPreview();
    const a = previewRef.current;
    a.src = `/api/folders/stream?path=${encodeURIComponent(file.path)}`;
    a.volume = volume; a.play().catch(() => {});
    setPreviewPath(file.path);
  };
  useEffect(() => { if (previewRef.current) previewRef.current.volume = volume; }, [volume]);
  useEffect(() => { if (!drawerOpen) stopFilePreview(); }, [drawerOpen]);
  const seekFilePreview = (e, file) => {
    const a = previewRef.current; if (!a || previewPath !== file.path || !a.duration) return;
    const r = e.currentTarget.getBoundingClientRect();
    a.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * a.duration;
  };
  // multi-select of folder files -> add to a project group
  const [selectedFiles, setSelectedFiles] = useState({});   // path -> file
  const toggleSelect = file => setSelectedFiles(sel => { const n = { ...sel }; if (n[file.path]) delete n[file.path]; else n[file.path] = file; return n; });
  const selectedList = Object.values(selectedFiles);
  // import (once) without opening; returns {track_id, name}
  const importFile = async file => {
    const r = await fetch('/api/folders/import', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: file.path }) });
    if (!r.ok) throw new Error((await r.json()).detail || t.err_upload);
    return await r.json();
  };
  const addSelectedToProject = async (gid) => {
    if (!selectedList.length) return;
    setError(null);
    try {
      setLoading(t.folders_importing);
      const imported = [];
      for (const f of selectedList) imported.push({ file: f, ...(await importFile(f)) });
      // update file rows (now imported) + history
      setFolderFiles(ff => { const n = { ...ff }; for (const k in n) n[k] = (n[k] || []).map(x => { const hit = imported.find(i => i.file.path === x.path); return hit ? { ...x, track_id: hit.track_id } : x; }); return n; });
      loadHistory();
      let targetGid = gid;
      let proj = project;
      if (!proj) {
        const r = await fetch('/api/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: t.project_new_name, groups: [{ name: t.project_group_default, items: [] }] }) });
        proj = await r.json(); setProject(proj); localStorage.setItem('musslop_project', proj.id); loadProjects();
        targetGid = proj.groups[0].id;
      }
      if (targetGid === '__new__') {
        const g = { id: uid(), name: `${t.project_group_default} ${proj.groups.length + 1}`, items: [] };
        proj = { ...proj, groups: [...proj.groups, g] }; targetGid = g.id;
      }
      const items = imported.map(i => ({ id: uid(), track_id: i.track_id, scene_id: null, note: '', track_name: i.name, scene_name: null, available: true }));
      editProject(() => ({ ...proj, groups: proj.groups.map(g => g.id === targetGid ? { ...g, items: [...g.items, ...items] } : g) }));
      setSelectedFiles({});
      showToast(`${t.project_item_added} (${items.length})`);
    } catch (e) { setError(String(e.message || e)); }
    finally { setLoading(null); }
  };
  // native folder dialog (server-side; works when the browser is on the same machine)
  const [picking, setPicking] = useState(false);
  const pickFolder = async () => {
    setFolderError(null); setPicking(true);
    try {
      const r = await fetch('/api/folders/pick', { method: 'POST' });
      if (!r.ok) throw new Error((await r.json()).detail || t.folders_err);
      const { path } = await r.json();
      if (path) { setFolderInput(path); await addFolderPath(path); }
    } catch (e) { setFolderError(String(e.message || e)); }
    finally { setPicking(false); }
  };
  const projSaveT = useRef(null);
  const loadProjects = useCallback(async () => {
    try {
      const r = await fetch('/api/projects');
      if (r.ok) setProjects((await r.json()).projects);
    } catch (e) {}
  }, []);
  useEffect(() => { loadProjects(); }, []);
  const openProject = async id => {
    try {
      const r = await fetch(`/api/projects/${id}`);
      if (!r.ok) return;
      const p = await r.json();
      setProject(p);
      localStorage.setItem('musslop_project', p.id);
    } catch (e) {}
  };
  // reopen the last project
  useEffect(() => {
    const id = localStorage.getItem('musslop_project');
    if (id) openProject(id);
  }, []);
  const createProject = async () => {
    const r = await fetch('/api/projects', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: t.project_new_name, groups: [{ name: t.project_group_default, items: [] }] }),
    });
    if (!r.ok) return;
    const p = await r.json();
    setProject(p);
    localStorage.setItem('musslop_project', p.id);
    loadProjects();
  };
  // any local edit -> debounced PUT
  const editProject = updater => {
    setProject(prev => {
      if (!prev) return prev;
      const next = typeof updater === 'function' ? updater(prev) : updater;
      clearTimeout(projSaveT.current);
      projSaveT.current = setTimeout(async () => {
        try {
          await fetch(`/api/projects/${next.id}`, {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: next.name, groups: next.groups }),
          });
          loadProjects();
        } catch (e) {}
      }, 600);
      return next;
    });
  };
  const deleteProject = async id => {
    await fetch(`/api/projects/${id}`, { method: 'DELETE' });
    if (project && project.id === id) { setProject(null); localStorage.removeItem('musslop_project'); }
    loadProjects();
  };
  const uid = () => Math.random().toString(36).slice(2, 10);
  const addGroup = () => editProject(p => ({ ...p, groups: [...p.groups, { id: uid(), name: `${t.project_group_default} ${p.groups.length + 1}`, items: [] }] }));
  const renameGroup = (gid, name) => editProject(p => ({ ...p, groups: p.groups.map(g => g.id === gid ? { ...g, name } : g) }));
  const removeGroup = gid => editProject(p => ({ ...p, groups: p.groups.filter(g => g.id !== gid) }));
  const moveGroup = (gid, dir) => editProject(p => {
    const i = p.groups.findIndex(g => g.id === gid), j = i + dir;
    if (i < 0 || j < 0 || j >= p.groups.length) return p;
    const gs = p.groups.slice(); [gs[i], gs[j]] = [gs[j], gs[i]];
    return { ...p, groups: gs };
  });
  // add the current track (+ optionally a scene) to a group
  const addItem = (gid, sceneId = null) => {
    if (!trackId) return;
    const sc = sceneId ? scenes.find(s => s.id === sceneId) : null;
    editProject(p => ({ ...p, groups: p.groups.map(g => g.id === gid
      ? { ...g, items: [...g.items, { id: uid(), track_id: trackId, scene_id: sceneId, note: '',
                                       track_name: trackName, scene_name: sc ? sc.name : null, available: true }] }
      : g) }));
    showToast(t.project_item_added);
  };
  const removeItem = (gid, iid) => editProject(p => ({ ...p, groups: p.groups.map(g => g.id === gid ? { ...g, items: g.items.filter(it => it.id !== iid) } : g) }));
  const moveItem = (gid, iid, dir) => editProject(p => ({ ...p, groups: p.groups.map(g => {
    if (g.id !== gid) return g;
    const i = g.items.findIndex(it => it.id === iid), j = i + dir;
    if (i < 0 || j < 0 || j >= g.items.length) return g;
    const its = g.items.slice(); [its[i], its[j]] = [its[j], its[i]];
    return { ...g, items: its };
  }) }));
  const noteItem = (gid, iid, note) => editProject(p => ({ ...p, groups: p.groups.map(g => g.id === gid ? { ...g, items: g.items.map(it => it.id === iid ? { ...it, note } : it) } : g) }));
  // open an item: same track -> just apply the scene; other track -> load it, then the scene
  const pendingSceneRef = useRef(null);
  const openItem = async it => {
    if (!it.available) return;
    if (it.track_id === trackId) {
      if (it.scene_id) { const sc = scenes.find(s => s.id === it.scene_id); if (sc) applyScene(sc); }
      else if (!player.playing) player.play(0);
      return;
    }
    pendingSceneRef.current = it.scene_id || null;
    await openFromHistory({ track_id: it.track_id, name: it.track_name });
  };
  // after a track from a project item finished loading -> start its scene
  useEffect(() => {
    const sid = pendingSceneRef.current;
    if (!sid || !buffer || !scenes.length) return;
    const sc = scenes.find(s => s.id === sid);
    pendingSceneRef.current = null;
    if (sc) setTimeout(() => applyScene(sc), 50);
  }, [buffer, scenes]);
  // scenes renamed/removed -> keep the open project's labels fresh
  useEffect(() => {
    if (!project || !trackId) return;
    setProject(p => p && ({ ...p, groups: p.groups.map(g => ({ ...g, items: g.items.map(it =>
      it.track_id === trackId ? { ...it, track_name: trackName,
        scene_name: it.scene_id ? ((scenes.find(s => s.id === it.scene_id) || {}).name || null) : null } : it) })) }));
  }, [scenes, trackId, trackName]);

  // --- Scenes -----------------------------------------------------------------
  // A scene = a saved playback state of this track: which part loops, which
  // layers are on, speed / crossfade / reverb and how to enter it. Scenes are
  // stored inside the track markup (autosaved with the segments).
  const scenesDirty = useRef(false);
  const setScenes = updater => setScenesRaw(prev => {
    const next = typeof updater === 'function' ? updater(prev) : updater;
    scenesDirty.current = true;
    return next;
  });
  const captureScene = (name) => {
    const seg = segments[player.segIndex];
    if (!seg) return;
    const id = Math.random().toString(36).slice(2, 8);
    const scene = {
      id, name: name || seg.label || `Scene ${scenes.length + 1}`,
      segIndex: player.segIndex,
      layers: stemsState === 'ready' ? JSON.parse(JSON.stringify(layers)) : null,
      rate, crossfade, reverb: reverbAmt, cueMode,
      hotkey: scenes.length < 9 ? String(scenes.length + 1) : null,
    };
    setScenes(sc => [...sc, scene]);
    showToast(`${t.scene_saved} ${scene.name}`);
  };
  const updateScene = (id, patch) => setScenes(sc => sc.map(s => s.id === id ? { ...s, ...patch } : s));
  const removeScene = id => setScenes(sc => sc.filter(s => s.id !== id));
  const applyScene = (scene, urgency) => {
    if (!scene || !segments[scene.segIndex]) return;
    // fx first: these ramp smoothly and don't interrupt playback
    if (scene.rate != null && scene.rate !== rate) { setRateState(scene.rate); player.setRate(scene.rate); }
    if (scene.crossfade != null) setCrossfade(scene.crossfade);
    if (scene.reverb != null) setReverbAmt(scene.reverb);
    if (scene.layers && stemsState === 'ready') {
      setLayersState(scene.layers);
      player.setLayers(scene.layers);
    }
    if (player.playing) {
      if (scene.segIndex === player.segIndex) player.cancelCue();
      else player.cue(scene.segIndex, urgency || scene.cueMode || cueMode);
    } else {
      player.play(scene.segIndex);
    }
    setActiveScene(scene.id);
  };
  const [activeScene, setActiveScene] = useState(null);
  // scenes of ALL tracks (server-side list) -> cross-track scene switching
  const [allScenes, setAllScenes] = useState([]);
  const loadAllScenes = useCallback(async () => {
    try { const r = await fetch('/api/scenes'); if (r.ok) setAllScenes((await r.json()).scenes); } catch (e) {}
  }, []);
  useEffect(() => { loadAllScenes(); }, []);
  // scenes of other tracks, grouped by track (current track's scenes come from `scenes`)
  const otherSceneGroups = (() => {
    const g = {};
    for (const sc of allScenes) {
      if (sc.track_id === trackId) continue;
      (g[sc.track_id] = g[sc.track_id] || { track_id: sc.track_id, track_name: sc.track_name, scenes: [] }).scenes.push(sc);
    }
    return Object.values(g);
  })();
  // apply a scene that lives on another track: load that track, then run the scene
  const applyRemoteScene = async sc => {
    pendingSceneRef.current = sc.id;
    await openFromHistory({ track_id: sc.track_id, name: sc.track_name });
  };
  // --- Live: switch tracks without leaving the desk ---------------------------
  // Track list for Live: the open project's items (in set-list order) if a
  // project is open, otherwise Library ★ then History. Switching fades the
  // current track out while the next one downloads; if music was playing,
  // the new track starts by itself (its project scene, or part 1).
  const [liveTracksOpen, setLiveTracksOpen] = useState(false);
  const [liveTrackFilter, setLiveTrackFilter] = useState('');
  useEffect(() => { if (liveTracksOpen) setLiveTrackFilter(''); }, [liveTracksOpen]);
  useEffect(() => { if (!liveMode) setLiveTracksOpen(false); }, [liveMode]);
  const [liveLoadTick, setLiveLoadTick] = useState(0);
  const [liveSwitching, setLiveSwitching] = useState(null);   // name of the track being loaded
  const livePlayRef = useRef(null);       // { sceneId } to start after a Live switch
  const liveSwitchingRef = useRef(false);
  const liveCurKeyRef = useRef(null);
  const liveTrackList = (() => {
    if (project && project.groups && project.groups.some(g => g.items.length)) {
      const out = [];
      for (const g of project.groups) for (const it of g.items) {
        if (!it.available) continue;
        out.push({ key: it.id, track_id: it.track_id, name: it.track_name, scene_id: it.scene_id || null,
                   group: g.name, sub: it.scene_name || '' });
      }
      return { source: 'project', items: out };
    }
    const fav = history.filter(h => h.favorite), rest = history.filter(h => !h.favorite);
    return { source: 'library', items: [...fav, ...rest].map(h => ({ key: h.track_id, track_id: h.track_id, name: h.name,
      scene_id: null, fav: !!h.favorite, sub: h.duration != null ? fmt(h.duration) : '' })) };
  })();
  const liveCurIndex = (() => {
    const L = liveTrackList.items;
    // project: prefer the exact item (scene) last opened, else the first item of this track
    const k = L.findIndex(x => x.key === liveCurKeyRef.current && x.track_id === trackId);
    return k >= 0 ? k : L.findIndex(x => x.track_id === trackId);
  })();
  const liveOpenTrack = async it => {
    if (!it || liveSwitchingRef.current) return;
    liveCurKeyRef.current = it.key;
    setLiveTracksOpen(false);
    if (it.track_id === trackId) {
      // same track: just start its scene / keep going
      if (it.scene_id) { const sc = scenes.find(x => x.id === it.scene_id); if (sc) applyScene(sc); }
      else if (!player.playing) player.play(0);
      force(x => x + 1);
      return;
    }
    liveSwitchingRef.current = true;
    setLiveSwitching(it.name);
    const wasPlaying = player.playing;
    const fade = wasPlaying ? new Promise(r => { player.fadeOut(1.5); setTimeout(r, 1600); }) : null;
    try {
      const ok = await openFromHistory({ track_id: it.track_id, name: it.name }, fade ? { beforeSwap: fade } : {});
      if (ok && (wasPlaying || it.scene_id)) {
        livePlayRef.current = { sceneId: it.scene_id };
        setLiveLoadTick(x => x + 1);
      }
    } finally {
      liveSwitchingRef.current = false;
      setLiveSwitching(null);
    }
  };
  // start the freshly loaded track (runs after the player got the new segments)
  useEffect(() => {
    const req = livePlayRef.current;
    if (!req || !buffer || !segments.length || player.buffer !== buffer) return;
    livePlayRef.current = null;
    const sc = req.sceneId ? scenes.find(x => x.id === req.sceneId) : null;
    setTimeout(() => { if (sc) applyScene(sc); else player.play(0); }, 30);
  }, [liveLoadTick, buffer, segments]);
  const liveStepTrack = dir => {
    const L = liveTrackList.items;
    if (!L.length) return;
    const i = liveCurIndex < 0 ? (dir > 0 ? 0 : L.length - 1) : liveCurIndex + dir;
    if (i < 0 || i >= L.length) return;
    liveOpenTrack(L[i]);
  };

  // Shift+digit: current track's scenes win; otherwise any track's scene with that hotkey
  const sceneByHotkey = d => scenes.find(s => s.hotkey === d) || allScenes.find(s => s.hotkey === d && s.track_id !== trackId) || null;
  // the active scene highlight follows the playing part
  useEffect(() => {
    if (!scenes.length) return;
    const sc = scenes.find(s => s.id === activeScene);
    if (sc && sc.segIndex !== player.segIndex) setActiveScene(null);
  }, [player.segIndex, player.playing]);
  const sceneForIndex = i => scenes.find(s => s.segIndex === i);
  // Part removed / merged -> drop scenes pointing beyond the list
  useEffect(() => {
    if (scenes.some(s => s.segIndex >= segments.length))
      setScenes(sc => sc.filter(s => s.segIndex < segments.length));
  }, [segments.length]);

  const [toast, setToast] = useState(null);
  const showToast = msg => {
    setToast(msg);
    setTimeout(() => setToast(null), 6000);
  };

  const doAnalyze = async (id, n, eng, bpb) => {
    setError(null);
    const useEngine = eng || 'fast';
    const isDeep = useEngine === 'deep' || useEngine === 'songformer';
    const prevCount = segments.length;
    setLoading(isDeep ? t.loading_deep : t.loading_analyze);
    if (isDeep) setAiWorking(true);
    try {
      const params = new URLSearchParams();
      if (n) params.set('n_segments', n);
      if (isDeep) params.set('engine', useEngine);
      if (bpb) params.set('beats_per_bar', bpb);
      const qs = params.toString();
      const r = await fetch(`/api/analyze/${id}${qs ? '?' + qs : ''}`);
      if (!r.ok) throw new Error((await r.json()).detail || t.err_analyze);
      const a = await r.json();
      setAnalysis(a);
      setSegments(a.segments);
      // re-analysis re-numbers the parts: old scenes would point at wrong parts
      setScenesRaw([]);
      setActiveScene(null);
      if (isDeep) {
        const labels = a.segments.slice(0, 5).map(s => s.label).join(', ')
          + (a.segments.length > 5 ? '…' : '');
        showToast(`✨ ${t.ai_done} ${prevCount || '—'} → ${a.segments.length}. ${labels}`);
      }
      return a;
    } catch (e) {
      setError(String(e.message || e));
      return null;
    } finally {
      setLoading(null);
      setAiWorking(false);
    }
  };

  // --- Meter (time signature) ---------------------------------------------
  // Changing the meter rebuilds the bar grid client-side from the beat list
  // (instant, parts stay where they are). bpb = null -> back to the detected
  // ("original") meter. Re-splitting parts for the new meter is a separate,
  // explicit action (it resets scenes).
  const setMeter = (bpb, phase) => {
    setAnalysis(a => {
      if (!a || !a.beats || !a.beats.length) return a;
      const m = a.meter || { detected: a.beats_per_bar || 4, confidence: 0, source: 'heuristic', detected_source: 'heuristic' };
      const detected = m.detected || 4;
      const auto = bpb == null;
      const B = auto ? detected : bpb;
      let ph = phase, db;
      if (ph == null && B === detected && a.downbeats_auto && a.downbeats_auto.length) {
        db = a.downbeats_auto;
        ph = gridPhase(a.beats, db, B);
      } else {
        if (ph == null) ph = bestMeterPhase(a.beat_accents, B);
        db = meterGrid(a.beats, B, ph);
      }
      return { ...a, beats_per_bar: B, downbeats: db,
               meter: { ...m, beats_per_bar: B, phase: ph,
                        source: auto ? (m.detected_source || 'heuristic') : 'manual' } };
    });
  };
  const shiftDownbeat = () => {
    if (!analysis) return;
    const B = analysis.beats_per_bar || 4;
    const ph = analysis.meter && analysis.meter.phase != null
      ? analysis.meter.phase : gridPhase(analysis.beats, analysis.downbeats, B);
    setMeter(B, (ph + 1) % B);
  };
  // a manually chosen meter survives re-analysis (any engine)
  const manualBpb = analysis && analysis.meter && analysis.meter.source === 'manual' ? analysis.beats_per_bar : null;
  const resplitForMeter = () => {
    if (!analysis || !trackId) return;
    const eng = analysis.engine === 'deep' || analysis.engine === 'songformer' ? analysis.engine : null;
    const auto = !analysis.meter || analysis.meter.source !== 'manual';
    doAnalyze(trackId, eng ? null : (nSeg ? +nSeg : null), eng, auto ? null : analysis.beats_per_bar);
  };

  // Универсальный приём файла: аудио / разметка / прочее — с защитой от
  // типовых ошибок использования
  const handleAnyFile = file => {
    const name = (file.name || '').toLowerCase();
    if (name.endsWith('.json')) {
      if (!analysis) {
        setError(t.err_markup_no_track);   // json без трека — понятная ошибка
        return;
      }
      importMarkup(file);
      return;
    }
    const audioExt = ['.mp3', '.wav', '.ogg', '.flac', '.m4a', '.aac', '.opus', '.webm'];
    if (audioExt.some(ext => name.endsWith(ext)) || (file.type || '').startsWith('audio/')) {
      if (file.size > 300 * 1024 * 1024) {
        setError(t.err_file_too_big);
        return;
      }
      upload(file);
      return;
    }
    setError(t.err_unknown_file + ' ' + (file.name || ''));
  };

  const onDropAny = e => {
    e.preventDefault(); setDragOver(false);
    const files = Array.from(e.dataTransfer.files || []);
    if (!files.length) return;
    if (files.length > 1) {
      // трек+разметка одним движением: сначала аудио, потом json
      const audio = files.find(f => !(f.name || '').toLowerCase().endsWith('.json'));
      const json = files.find(f => (f.name || '').toLowerCase().endsWith('.json'));
      if (audio && json) {
        setPendingMarkupFile(json);
        handleAnyFile(audio);
        return;
      }
    }
    handleAnyFile(files[0]);
  };

  // Файлы принимаются на ВСЁ окно: кинул трек на волну — заменил трек,
  // кинул json — применил разметку. Дроп-зоны остаются как подсказка.
  const onDropAnyRef = useRef(onDropAny);
  onDropAnyRef.current = onDropAny;
  useEffect(() => {
    const over = e => {
      if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) {
        e.preventDefault();
        setDragOver(true);
      }
    };
    const leave = e => {
      // покидание окна (relatedTarget = null)
      if (!e.relatedTarget) setDragOver(false);
    };
    const drop = e => {
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
        onDropAnyRef.current(e);
      }
    };
    window.addEventListener('dragover', over);
    window.addEventListener('dragleave', leave);
    window.addEventListener('drop', drop);
    return () => {
      window.removeEventListener('dragover', over);
      window.removeEventListener('dragleave', leave);
      window.removeEventListener('drop', drop);
    };
  }, []);

  const removeSeg = i => {
    if (segments.length <= 1) return;
    setSegments(segs => {
      const ns = segs.map(s => ({ ...s }));
      if (i === 0) { ns[1].start = ns[0].start; }
      else { ns[i - 1].end = ns[i].end; }
      ns.splice(i, 1);
      return ns;
    });
  };

  // Split a part at point pos (sec); snapped to the nearest downbeat
  const splitAt = pos => {
    if (pos == null || !analysis) return;
    let tt = pos;
    const dbs = analysis.downbeats || [];
    if (dbs.length) {
      let best = tt, bd = Infinity;
      for (const b of dbs) { const d = Math.abs(b - tt); if (d < bd) { bd = d; best = b; } }
      if (bd < 2.5) tt = best;
    }
    setSegments(segs => {
      const i = segs.findIndex(s => tt > s.start + 0.5 && tt < s.end - 0.5);
      if (i < 0) return segs;
      const ns = segs.map(s => ({ ...s }));
      const right = { start: tt, end: ns[i].end, label: ns[i].label + '·2' };
      ns[i] = { ...ns[i], end: tt };
      ns.splice(i + 1, 0, right);
      return ns;
    });
  };

  // Split at the current position (playing / picked by click), otherwise — the middle of the selected part
  const splitAtPlayhead = () => {
    let pos = player.position();
    if (pos == null) pos = player.pendingPos;
    if (pos == null && segments[player.segIndex]) {
      const s = segments[player.segIndex];
